<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose your grade | Boom AI</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>

  <style>
    /* Page-specific layout only. */
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: var(--sp-4); position: relative; }
    .moe-logo { position: absolute; top: var(--sp-4); left: var(--sp-4); height: var(--sp-7); width: auto; }

    #main-content { width: 100%; max-width: 520px; flex: 1; padding-top: calc(var(--sp-7) * 2 + var(--sp-3)); }
    @media (min-width: 768px) { #main-content { padding-top: var(--sp-7); } }

    #grade-selection { padding: var(--sp-5); }
    #grade-selection h1 { margin: 0 0 var(--sp-5); }

    .grade-group + .grade-group { margin-top: var(--sp-5); }
    .grade-group h2 { font-size: var(--fs-3); font-weight: var(--fw-semibold); color: var(--text-muted); margin: 0 0 var(--sp-2); }

    .grade-list { display: flex; flex-direction: column; gap: var(--sp-3); }
    /* Main feature: large, easy-to-hit grade buttons */
    .grade-list button { width: 100%; justify-content: space-between; padding: var(--sp-4) var(--sp-5); font-size: var(--fs-4); }
    /* The grade you picked last time is the one solid action */
    .grade-list button.is-last { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .grade-list button.is-last:hover { background: var(--accent); border-color: var(--accent); filter: brightness(1.08); }

    .read-summary { margin: var(--sp-5) 0 0; font-size: var(--fs-2); color: var(--text-muted); }
    .home-link { margin-top: var(--sp-4); border-color: transparent; color: var(--text-muted); padding-left: 0; }
    .home-link:hover { background: transparent; color: var(--text); border-color: transparent; }

    .footer { margin-top: var(--sp-7); padding: var(--sp-5) 0 var(--sp-2); }
  </style>
</head>
<body>
  <div class="theme-switcher">
    <button class="theme-button" data-theme="dark" aria-label="Dark theme"><i class="fas fa-moon"></i></button>
    <button class="theme-button" data-theme="light" aria-label="Light theme"><i class="fas fa-sun"></i></button>
    <button class="theme-button" data-theme="sepia" aria-label="Sepia theme"><i class="fas fa-book-open"></i></button>
    <button class="theme-button" data-theme="midnight" aria-label="Midnight theme"><i class="fas fa-star"></i></button>
    <button class="theme-button" data-theme="ocean" aria-label="Ocean theme"><i class="fas fa-water"></i></button>
    <button class="theme-button" data-theme="forest" aria-label="Forest theme"><i class="fas fa-leaf"></i></button>
    <button class="theme-button" data-theme="rose" aria-label="Rose theme"><i class="fas fa-spa"></i></button>
  </div>

  <img src="moe-logo.webp" alt="Ministry of Education Logo" class="moe-logo">

  <main id="main-content">
    <section id="grade-selection">
      <h1>Choose your grade</h1>

      <div class="grade-group">
        <h2>Junior school</h2>
        <div class="grade-list">
          <button type="button" data-grade="Grade 7" onclick="selectGrade('Grade 7')">Grade 7 <i class="fas fa-chevron-right" aria-hidden="true"></i></button>
          <button type="button" data-grade="Grade 8" onclick="selectGrade('Grade 8')">Grade 8 <i class="fas fa-chevron-right" aria-hidden="true"></i></button>
          <button type="button" data-grade="Grade 9" onclick="selectGrade('Grade 9')">Grade 9 <i class="fas fa-chevron-right" aria-hidden="true"></i></button>
        </div>
      </div>

      <div class="grade-group">
        <h2>Senior school</h2>
        <div class="grade-list">
          <button type="button" data-grade="Grade 10" onclick="selectGrade('Grade 10')">Grade 10 <i class="fas fa-chevron-right" aria-hidden="true"></i></button>
        </div>
      </div>

      <p class="read-summary" id="weeklySummaryCard"><span id="weeklyReadText">You have read 0 notes</span></p>

      <button type="button" class="home-button home-link" onclick="window.location.href='index.html'">
        <i class="fas fa-arrow-left" aria-hidden="true"></i> Back to home
      </button>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Boom AI. Powered by Pope John.</p>
  </footer>

  <script>
    function selectGrade(grade) {
      localStorage.setItem('selectedGrade', grade);
      window.location.href = 'subjects.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      calculateReadSummary();
      markLastGrade();
    });

    // Highlight the grade chosen last time, if any
    function markLastGrade() {
      const last = localStorage.getItem('selectedGrade');
      if (!last) return;
      const btn = document.querySelector(`.grade-list button[data-grade="${last}"]`);
      if (btn) btn.classList.add('is-last');
    }

    // boom_read_notes holds every note ever read (no dates), so the text no longer says "this week"
    function calculateReadSummary() {
      let count = 0;
      try { count = JSON.parse(localStorage.getItem('boom_read_notes') || '[]').length; } catch (e) {}
      document.getElementById('weeklyReadText').textContent = `You have read ${count} note${count === 1 ? '' : 's'}`;
    }
  </script>
</body>
</html>
