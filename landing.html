<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boom AI - Select Grade</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      position: relative;
    }
    .moe-logo { position: absolute; top: 20px; left: 20px; height: 50px; z-index: 10; }
    
    #main-content {
      animation: fadeIn 1s ease-in-out;
      width: 100%;
      max-width: 500px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
    }
    #grade-selection {
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
    }
    h1 {
      font-weight: 700;
      font-size: 2.5rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      color: var(--heading-color);
    }
    
    .weekly-summary-card {
      background: var(--button-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .inspiration-message {
      font-size: 1.05rem;
      margin-bottom: 30px;
      padding: 18px;
      background: var(--button-bg);
      border: 1px solid var(--border-color);
      border-radius: 15px;
      font-style: italic;
      line-height: 1.6;
      color: var(--text-color);
    }
    .grade-list { display: flex; flex-direction: column; gap: 15px; }
    .grade-list button {
      padding: 16px 30px;
      border: 1px solid var(--border-color);
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--button-bg);
      color: var(--button-text);
      transition: all 0.3s ease;
    }
    .grade-list button:hover {
      background: var(--button-hover-bg);
      color: var(--button-hover-text);
      transform: translateY(-3px);
    }
    .home-button {
      margin-top: 20px; padding: 12px 25px; border-radius: 50px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      background: var(--button-bg); color: var(--button-text);
      border: 1px solid var(--border-color); display: inline-flex; align-items: center; gap: 8px;
    }

    .footer { margin-top: 30px; padding: 15px; font-size: 0.9rem; text-align: center; width: 100%; color: var(--text-color); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="background-aurora">
      <div class="aurora-shape shape1"></div>
      <div class="aurora-shape shape2"></div>
      <div class="aurora-shape shape3"></div>
  </div>

  <div class="theme-switcher">
    <button class="theme-button" data-theme="dark" aria-label="Dark theme"><i class="fas fa-moon"></i></button>
    <button class="theme-button" data-theme="light" aria-label="Light theme"><i class="fas fa-sun"></i></button>
    <button class="theme-button" data-theme="sepia" aria-label="Sepia theme"><i class="fas fa-book-open"></i></button>
    <button class="theme-button" data-theme="midnight" aria-label="Midnight theme"><i class="fas fa-star-of-david"></i></button>
    <button class="theme-button" data-theme="ocean" aria-label="Ocean theme"><i class="fas fa-water"></i></button>
    <button class="theme-button" data-theme="forest" aria-label="Forest theme"><i class="fas fa-leaf"></i></button>
    <button class="theme-button" data-theme="rose" aria-label="Rose theme"><i class="fas fa-spa"></i></button>
  </div>

  <img src="moe-logo.webp" alt="Ministry of Education Logo" class="moe-logo">

  <div id="main-content">
    <section id="grade-selection">
      <h1><i class="fas fa-graduation-cap"></i> Select Grade</h1>

      <div class="weekly-summary-card" id="weeklySummaryCard">
        <i class="fas fa-chart-line" style="color: var(--accent-color-1);"></i>
        <span id="weeklyReadText">You’ve read 0 notes this week</span>
      </div>

      <div class="inspiration-message">
        "Every step you take in learning builds a stronger future. Embrace the journey of discovery!"
      </div>
      <div class="grade-list">
        <button onclick="selectGrade('Grade 7')">Grade 7</button>
        <button onclick="selectGrade('Grade 8')">Grade 8</button>
        <button onclick="selectGrade('Grade 9')">Grade 9</button>
      </div>
      <button class="home-button" onclick="window.location.href='index.html'">
        <i class="fas fa-home"></i> Go back to home page
      </button>
    </section>
  </div>

  <footer class="footer">
      <p>&copy; 2026 Boom AI. Powered by Pope John.</p>
  </footer> 

  <script>
    function selectGrade(grade) {
      localStorage.setItem('selectedGrade', grade);
      window.location.href = 'subjects.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      calculateWeeklyReadSummary();

      window.addEventListener('scroll', () => {
        const switcher = document.querySelector('.theme-switcher');
        if (window.scrollY > 50 && switcher) {
          switcher.style.opacity = '0.3';
        } else if (switcher) {
          switcher.style.opacity = '1';
        }
      });
    });

    function calculateWeeklyReadSummary() {
      const readNotes = JSON.parse(localStorage.getItem('boom_read_notes') || '[]');
      const count = readNotes.length;
      document.getElementById('weeklyReadText').textContent = `You’ve read ${count} note${count === 1 ? '' : 's'} this week!`;
    }
  </script>
</body>
</html>
