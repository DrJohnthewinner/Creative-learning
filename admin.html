<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Boom AI</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column;
      justify-content: space-between; align-items: center;
      padding: 20px; position: relative;
    }

    #main-content {
      flex-grow: 1; display: flex;
      justify-content: center; align-items: center;
      width: 100%; max-width: 1100px;
      padding-top: 50px;
    }

    .container {
      width: 100%; display: flex; flex-direction: column;
      gap: 20px; padding: 20px; border-radius: 15px;
    }

    .card {
      background: var(--button-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px; padding: 30px;
      box-shadow: 0 4px 20px var(--shadow-color);
      text-align: center; transition: all 0.4s ease-in-out;
      opacity: 0; transform: translateY(20px);
      pointer-events: none; display: none;
    }
    .card.active { opacity: 1; transform: translateY(0); pointer-events: auto; display: block; }
    .card h2 { margin-bottom: 25px; color: var(--accent-color-1); font-weight: 600; }

    /* Inputs & Selects */
    #main-content input[type="email"],
    #main-content input[type="password"],
    #main-content input[type="text"],
    #main-content textarea,
    #main-content select {
      width: 100%; padding: 12px; margin: 10px 0;
      border: 1px solid var(--border-color);
      border-radius: 8px; background: var(--button-bg);
      color: var(--text-color); font-size: 1rem; font-family: inherit;
      transition: border-color 0.3s ease;
    }
    #main-content input[type="file"] { width: 100%; margin: 10px 0; color: var(--text-color); }
    #main-content input:focus, #main-content textarea:focus, #main-content select:focus { border-color: var(--accent-color-1); outline: none; }
    #main-content select option { background: var(--bg-gradient-end); color: var(--text-color); }

    .char-counter { font-size: 0.8rem; text-align: right; opacity: 0.7; margin-bottom: 5px; }

    /* Checkbox Group for Pinned Notes */
    .checkbox-group { display: flex; align-items: center; gap: 10px; margin: 12px 0; text-align: left; font-size: 0.95rem; color: var(--text-color); cursor: pointer; }
    .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }

    /* Password Container */
    .password-group { position: relative; width: 100%; }
    .password-toggle { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-color); opacity: 0.7; }

    /* Buttons */
    #main-content button {
      background: var(--button-hover-bg); color: var(--button-hover-text);
      padding: 12px 25px; border: none; border-radius: 8px;
      cursor: pointer; font-size: 1rem; font-weight: 500; font-family: inherit;
      margin: 10px 5px; display: inline-flex;
      align-items: center; justify-content: center; gap: 8px;
      transition: filter 0.3s ease, transform 0.2s ease;
    }
    #main-content button:hover { filter: brightness(1.12); transform: translateY(-2px); }
    #main-content .logout-button { background: #e5484d; color: #fff; float: right; margin-bottom: 20px; }

    .error { color: #e5484d; margin-top: 15px; font-size: 0.9rem; font-weight: 600; }

    /* Admin Workspace Grid */
    .admin-workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: left; }
    @media(max-width: 768px) { .admin-workspace { grid-template-columns: 1fr; } }

    .preview-pane { background: rgba(0,0,0,0.15); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; max-height: 500px; overflow-y: auto; }
    .preview-pane h3 { font-size: 1rem; margin-bottom: 10px; opacity: 0.8; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }

    /* Filters & Counters Bar */
    .admin-filter-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .admin-filter-bar input, .admin-filter-bar select { flex: 1; min-width: 150px; margin: 0; padding: 8px; }
    
    .subject-counter-summary { font-size: 0.85rem; margin-bottom: 15px; opacity: 0.85; text-align: left; background: var(--button-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); }

    /* Upload Progress Bar */
    .progress-bar-container { width: 100%; background: rgba(255,255,255,0.1); border-radius: 8px; height: 10px; overflow: hidden; margin: 10px 0; display: none; }
    .progress-bar-fill { height: 100%; background: #00c853; width: 0%; transition: width 0.2s ease; }

    /* Notes list */
    .note-list { margin-top: 20px; background: var(--button-bg); border-radius: 10px; padding: 15px; max-height: 400px; overflow-y: auto; border: 1px solid var(--border-color); }
    .note-item { background: var(--button-bg); border: 1px solid var(--border-color); border-left: 5px solid var(--accent-color-1); border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .note-item span { flex-grow: 1; text-align: left; color: var(--text-color); }
    .note-item strong { color: var(--heading-color); font-size: 1.1em; }
    .note-item .actions button { padding: 6px 10px; font-size: 0.85rem; margin-left: 5px; color: #fff; }

    .last-saved-timestamp { font-size: 0.8rem; opacity: 0.7; text-align: right; margin-top: 5px; }

    .footer { margin-top: 30px; text-align: center; font-size: 0.9em; color: var(--text-color); opacity: 0.8; }
    .footer a { color: inherit; text-decoration: none; }
  </style>
</head>

<body>
  <div class="background-aurora">
    <div class="aurora-shape shape1"></div>
    <div class="aurora-shape shape2"></div>
    <div class="aurora-shape shape3"></div>
  </div>

  <div id="main-content">
    <div class="container">
      
      <!-- Login Section -->
      <div class="card login-section active" id="login-section">
        <h2>Admin Login</h2>
        <form id="login-form" onsubmit="login(event)" novalidate>
          <input type="email" id="email" placeholder="Email" autocomplete="username" required>
          <div class="password-group">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
            <i class="fas fa-eye password-toggle" id="togglePassword" onclick="togglePasswordVisibility()"></i>
          </div>
          <button type="submit" id="login-button">Login</button>
        </form>
        <div class="error" id="login-error" role="alert"></div>
      </div>

      <!-- Dashboard Section -->
      <div class="card dashboard-section" id="dashboard-section">
        <button class="logout-button" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        <h2>Admin Dashboard</h2>

        <div class="admin-workspace">
          <!-- Editor Form -->
          <form id="note-form">
            <input type="text" id="note-topic" placeholder="Note Topic (e.g., Algebra)" required oninput="triggerAutosave(); updateLivePreview();">
            
            <input type="text" id="sub-topic" placeholder="Sub Topic (e.g., Quadratic Equations)" required oninput="triggerAutosave(); updateLivePreview();">
            
            <div>
              <input type="text" id="note-title" placeholder="Note Title" maxlength="60" required oninput="updateCharCount(); triggerAutosave(); updateLivePreview();">
              <div class="char-counter" id="charCounter">0 / 60 characters</div>
            </div>

            <textarea id="content" rows="6" placeholder="Note Content (HTML tags allowed)" required oninput="triggerAutosave(); updateLivePreview();"></textarea>

            <select id="subject" required onchange="saveLastSubjectGrade(); triggerAutosave();">
              <option value="" disabled selected>Select Subject</option>
              <option value="mathematics">Mathematics</option>
              <option value="english">English</option>
              <option value="kiswahili">Kiswahili</option>
              <option value="integrated-science">Integrated Science</option>
              <option value="social-studies">Social Studies</option>
              <option value="cre">Christian Religious Education</option>
              <option value="pre-technical">Pre-Technical</option>
              <option value="agriculture-nutrition">Agriculture and Nutrition</option>
              <option value="creative-arts-sports">Creative Arts and Sports</option>
            </select>

            <select id="grade" required onchange="saveLastSubjectGrade(); triggerAutosave();">
              <option value="" disabled selected>Select Grade</option>
              <option value="Grade 7">Grade 7</option>
              <option value="Grade 8">Grade 8</option>
              <option value="Grade 9">Grade 9</option>
            </select>

            <!-- Pin/Feature Note Checkbox -->
            <label class="checkbox-group">
              <input type="checkbox" id="isPinned" onchange="triggerAutosave()"> Pin / Feature this note to top
            </label>

            <!-- File Upload & Attachment Management -->
            <div id="current-attachment-box" style="display:none; text-align:left; font-size:0.85rem; margin: 10px 0; padding:8px; background:var(--button-bg); border-radius:6px;">
              <strong>Current Attachment:</strong> <a id="current-attachment-link" href="#" target="_blank">View File</a>
              <label style="display:block; margin-top:5px; cursor:pointer;"><input type="checkbox" id="removeFileCheckbox"> Remove attached file</label>
            </div>

            <input type="file" id="fileInput" accept="application/pdf,image/*" onchange="validateFile(this)">
            
            <div class="progress-bar-container" id="uploadProgressContainer">
              <div class="progress-bar-fill" id="uploadProgressBar"></div>
            </div>

            <div class="last-saved-timestamp" id="lastSavedTimestamp">Draft not saved yet</div>

            <div style="display:flex; gap:10px; margin-top:15px; flex-wrap:wrap;">
              <button type="submit" id="submit-button" style="flex:2;"><i class="fas fa-upload"></i> Upload Note</button>
              <button type="button" onclick="clearForm()" style="flex:1; background:#6c757d;"><i class="fas fa-eraser"></i> Clear</button>
              <button type="button" id="cancel-edit-button" style="display: none; flex:1; background:#ff9800;" onclick="cancelEdit()">Cancel</button>
            </div>
          </form>

          <!-- Live Preview Pane -->
          <div class="preview-pane">
            <h3><i class="fas fa-eye"></i> Live Preview</h3>
            <div id="livePreviewContent" style="color:var(--text-color); word-break:break-word;">
              <em>Start typing to see live preview...</em>
            </div>
          </div>
        </div>

        <!-- Filter & Search Bar for Admin Notes -->
        <hr style="border-color:var(--border-color); margin: 25px 0;">
        
        <div class="subject-counter-summary" id="subjectCounterSummary">
          Calculating notes-per-subject...
        </div>

        <div class="admin-filter-bar">
          <input type="text" id="adminSearchInput" placeholder="Search uploaded notes..." oninput="filterAdminNotes()">
          <select id="adminSubjectFilter" onchange="filterAdminNotes()">
            <option value="">All Subjects</option>
            <option value="mathematics">Mathematics</option>
            <option value="english">English</option>
            <option value="kiswahili">Kiswahili</option>
            <option value="integrated-science">Integrated Science</option>
            <option value="social-studies">Social Studies</option>
            <option value="cre">CRE</option>
            <option value="pre-technical">Pre-Technical</option>
            <option value="agriculture-nutrition">Agriculture and Nutrition</option>
            <option value="creative-arts-sports">Creative Arts and Sports</option>
          </select>
          <select id="adminGradeFilter" onchange="filterAdminNotes()">
            <option value="">All Grades</option>
            <option value="Grade 7">Grade 7</option>
            <option value="Grade 8">Grade 8</option>
            <option value="Grade 9">Grade 9</option>
          </select>
        </div>

        <div class="note-list" id="note-list"></div>
      </div>

    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Boom AI. Powered by Pope John.</p>
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyABCpgwLNKvUxdYtnz5HBHH9IlnDZgEbUo",
      authDomain: "creative-learning-f2252.firebaseapp.com",
      projectId: "creative-learning-f2252",
      storageBucket: "creative-learning-f2252.appspot.com",
      messagingSenderId: "451756350336",
      appId: "1:451756350336:web:19b9255b8834a01f4cff65"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const SUPABASE_URL = 'https://jjqbpiujwmlfgztpinyp.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqcWJwaXVqd21sZmd6dHBpbnlwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc0OTM5MDczOCwiZXhwIjoyMDY0OTY2NzM4fQ.Jo9Mid8gRnhzMBeY_JN58aGwXHsC-0PfD_LwD292wyk';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allAdminNotes = [];
    let editingNoteId = null;
    let currentFileUrl = null;
    let idleTimer = null;
    let formHasUnsavedChanges = false;

    // --- AUTH & IDLE LOGOUT ---
    auth.onAuthStateChanged(user => {
      if (user) {
        showDashboard();
        resetIdleTimer();
      } else {
        showLogin();
      }
    });

    function resetIdleTimer() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        auth.signOut().then(() => {
          alert("Auto logged out due to 30 minutes of inactivity.");
          showLogin();
        });
      }, 30 * 60 * 1000);
    }

    window.addEventListener('mousemove', resetIdleTimer);
    window.addEventListener('keypress', resetIdleTimer);

    document.addEventListener('DOMContentLoaded', () => {
      const savedEmail = localStorage.getItem('boom_admin_email');
      if (savedEmail) {
        document.getElementById('email').value = savedEmail;
      }
      loadLastSubjectGrade();
      loadDraftFromBrowser();
    });

    function togglePasswordVisibility() {
      const passField = document.getElementById('password');
      const icon = document.getElementById('togglePassword');
      if (passField.type === 'password') {
        passField.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        passField.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    async function login(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      try {
        await auth.signInWithEmailAndPassword(email, password);
        localStorage.setItem('boom_admin_email', email);
        showDashboard();
      } catch (err) {
        document.getElementById('login-error').textContent = err.message;
      }
    }

    function logout() { auth.signOut(); }
    function showLogin() {
      document.getElementById('login-section').classList.add('active');
      document.getElementById('dashboard-section').classList.remove('active');
    }
    function showDashboard() {
      document.getElementById('login-section').classList.remove('active');
      document.getElementById('dashboard-section').classList.add('active');
      loadAdminNotes();
    }

    // --- REMEMBER LAST SUBJECT AND GRADE ---
    function saveLastSubjectGrade() {
      const subj = document.getElementById('subject').value;
      const grade = document.getElementById('grade').value;
      if (subj) localStorage.setItem('boom_last_admin_subject', subj);
      if (grade) localStorage.setItem('boom_last_admin_grade', grade);
    }

    function loadLastSubjectGrade() {
      const lastSubj = localStorage.getItem('boom_last_admin_subject');
      const lastGrade = localStorage.getItem('boom_last_admin_grade');
      if (lastSubj && !editingNoteId) document.getElementById('subject').value = lastSubj;
      if (lastGrade && !editingNoteId) document.getElementById('grade').value = lastGrade;
    }

    window.addEventListener('beforeunload', (e) => {
      if (formHasUnsavedChanges) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    function markFormChanged() { formHasUnsavedChanges = true; }

    function updateCharCount() {
      const title = document.getElementById('note-title').value;
      document.getElementById('charCounter').textContent = `${title.length} / 60 characters`;
      markFormChanged();
    }

    function updateLivePreview() {
      const topic = document.getElementById('note-topic').value;
      const subtopic = document.getElementById('sub-topic').value;
      const title = document.getElementById('note-title').value;
      const content = document.getElementById('content').value;

      document.getElementById('livePreviewContent').innerHTML = `
        <h4 style="color:var(--heading-color);">${topic || 'Topic Preview'}</h4>
        <em style="font-size:0.85rem;">${subtopic}</em>
        <h2 style="font-size:1.2rem; margin:8px 0;">${title || 'Title Preview'}</h2>
        <div style="margin-top:10px;">${content || 'Content preview will appear here...'}</div>
      `;
      markFormChanged();
    }

    function triggerAutosave() {
      const draft = {
        topic: document.getElementById('note-topic').value,
        subtopic: document.getElementById('sub-topic').value,
        title: document.getElementById('note-title').value,
        content: document.getElementById('content').value,
        subject: document.getElementById('subject').value,
        grade: document.getElementById('grade').value,
        isPinned: document.getElementById('isPinned').checked
      };
      localStorage.setItem('boom_admin_draft', JSON.stringify(draft));
      const nowStr = new Date().toLocaleTimeString();
      document.getElementById('lastSavedTimestamp').textContent = `Last saved at ${nowStr}`;
    }

    function loadDraftFromBrowser() {
      const saved = localStorage.getItem('boom_admin_draft');
      if (saved && !editingNoteId) {
        try {
          const d = JSON.parse(saved);
          document.getElementById('note-topic').value = d.topic || '';
          document.getElementById('sub-topic').value = d.subtopic || '';
          document.getElementById('note-title').value = d.title || '';
          document.getElementById('content').value = d.content || '';
          if (d.subject) document.getElementById('subject').value = d.subject;
          if (d.grade) document.getElementById('grade').value = d.grade;
          document.getElementById('isPinned').checked = !!d.isPinned;
          updateCharCount();
          updateLivePreview();
        } catch(e){}
      }
    }

    function validateFile(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const maxSize = 10 * 1024 * 1024;
        if (file.size > maxSize) {
          alert("File is too large! Maximum size allowed is 10MB.");
          input.value = '';
          return;
        }
        if (!['application/pdf', 'image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
          alert("Invalid file type. Only PDF and images are allowed.");
          input.value = '';
          return;
        }
      }
    }

    function clearForm() {
      document.getElementById('note-form').reset();
      document.getElementById('current-attachment-box').style.display = 'none';
      editingNoteId = null;
      currentFileUrl = null;
      localStorage.removeItem('boom_admin_draft');
      loadLastSubjectGrade();
      document.getElementById('lastSavedTimestamp').textContent = 'Form cleared';
      document.getElementById('submit-button').innerHTML = '<i class="fas fa-upload"></i> Upload Note';
      document.getElementById('cancel-edit-button').style.display = 'none';
      formHasUnsavedChanges = false;
      updateLivePreview();
      updateCharCount();
    }

    async function loadAdminNotes() {
      const listContainer = document.getElementById('note-list');
      listContainer.innerHTML = `<div style="text-align:center; padding:20px;"><i class="fas fa-spinner fa-spin"></i> Loading notes...</div>`;
      
      try {
        const snapshot = await db.collection('notes').orderBy('createdAt', 'desc').get();
        allAdminNotes = [];
        const counts = {};

        snapshot.forEach(doc => {
          const data = doc.data();
          allAdminNotes.push({ id: doc.id, ...data });
          counts[data.subject] = (counts[data.subject] || 0) + 1;
        });

        renderSubjectCounters(counts);
        renderAdminNotesList(allAdminNotes);
      } catch (err) {
        listContainer.innerHTML = '<p style="color:red; text-align:center;">Error loading notes.</p>';
      }
    }

    function renderSubjectCounters(counts) {
      const summary = document.getElementById('subjectCounterSummary');
      let html = '<strong><i class="fas fa-chart-bar"></i> Notes per Subject:</strong> ';
      const subjects = ['mathematics', 'english', 'kiswahili', 'integrated-science', 'social-studies', 'cre', 'pre-technical', 'agriculture-nutrition', 'creative-arts-sports'];
      
      html += subjects.map(s => `${s.replace(/-/g, ' ')} (${counts[s] || 0})`).join(' | ');
      summary.innerHTML = html;
    }

    function renderAdminNotesList(notes) {
      const listContainer = document.getElementById('note-list');
      if (notes.length === 0) {
        listContainer.innerHTML = '<p style="text-align:center; opacity:0.8;">No matching notes found.</p>';
        return;
      }

      listContainer.innerHTML = notes.map(n => `
        <div class="note-item">
          <span>
            ${n.isPinned ? '<i class="fas fa-thumbtack" style="color:#ff9800; margin-right:5px;" title="Pinned Note"></i>' : ''}
            <strong>${n.noteTopic}</strong> - <em>${n.noteTitle}</em><br>
            <small style="opacity:0.7;">${n.subject} | ${n.grade}</small>
          </span>
          <div class="actions">
            <button onclick="duplicateNote('${n.id}')" style="background:#00bcd4;" title="Duplicate"><i class="fas fa-copy"></i></button>
            <button onclick="editNote('${n.id}')" style="background:#2196F3;" title="Edit"><i class="fas fa-edit"></i></button>
            <button onclick="deleteNote('${n.id}')" style="background:#e5484d;" title="Delete"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    }

    function filterAdminNotes() {
      const search = document.getElementById('adminSearchInput').value.toLowerCase();
      const subject = document.getElementById('adminSubjectFilter').value;
      const grade = document.getElementById('adminGradeFilter').value;

      const filtered = allAdminNotes.filter(n => {
        const matchesSearch = (n.noteTopic || '').toLowerCase().includes(search) || (n.noteTitle || '').toLowerCase().includes(search);
        const matchesSubj = !subject || n.subject === subject;
        const matchesGrade = !grade || n.grade === grade;
        return matchesSearch && matchesSubj && matchesGrade;
      });

      renderAdminNotesList(filtered);
    }

    function duplicateNote(id) {
      const note = allAdminNotes.find(n => n.id === id);
      if (!note) return;

      document.getElementById('note-topic').value = note.noteTopic + ' (Copy)';
      document.getElementById('sub-topic').value = note.subTopic || '';
      document.getElementById('note-title').value = note.noteTitle || '';
      document.getElementById('content').value = note.content || '';
      document.getElementById('subject').value = note.subject || '';
      document.getElementById('grade').value = note.grade || '';
      document.getElementById('isPinned').checked = !!note.isPinned;

      editingNoteId = null;
      currentFileUrl = null;
      document.getElementById('current-attachment-box').style.display = 'none';
      document.getElementById('submit-button').innerHTML = '<i class="fas fa-upload"></i> Upload Note (Duplicate)';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      updateCharCount();
      updateLivePreview();
      markFormChanged();
    }

    async function editNote(id) {
      const note = allAdminNotes.find(n => n.id === id);
      if (!note) return;

      document.getElementById('note-topic').value = note.noteTopic || '';
      document.getElementById('sub-topic').value = note.subTopic || '';
      document.getElementById('note-title').value = note.noteTitle || '';
      document.getElementById('content').value = note.content || '';
      document.getElementById('subject').value = note.subject || '';
      document.getElementById('grade').value = note.grade || '';
      document.getElementById('isPinned').checked = !!note.isPinned;

      editingNoteId = id;
      currentFileUrl = note.fileUrl || null;

      if (currentFileUrl) {
        document.getElementById('current-attachment-link').href = currentFileUrl;
        document.getElementById('current-attachment-box').style.display = 'block';
        document.getElementById('removeFileCheckbox').checked = false;
      } else {
        document.getElementById('current-attachment-box').style.display = 'none';
      }

      document.getElementById('submit-button').innerHTML = '<i class="fas fa-save"></i> Save Changes';
      document.getElementById('cancel-edit-button').style.display = 'inline-flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      updateCharCount();
      updateLivePreview();
    }

    function cancelEdit() { clearForm(); }

    document.getElementById('note-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-button');
      submitBtn.disabled = true;

      const noteData = {
        noteTopic: document.getElementById('note-topic').value.trim(),
        subTopic: document.getElementById('sub-topic').value.trim(),
        noteTitle: document.getElementById('note-title').value.trim(),
        content: document.getElementById('content').value,
        subject: document.getElementById('subject').value,
        grade: document.getElementById('grade').value,
        isPinned: document.getElementById('isPinned').checked,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      const fileInput = document.getElementById('fileInput');
      const removeFile = document.getElementById('removeFileCheckbox').checked;

      if (removeFile) {
        noteData.fileUrl = null;
        noteData.fileType = null;
        noteData.fileName = null;
      } else if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const filePath = `notes/${Date.now()}-${file.name}`;
        
        const progContainer = document.getElementById('uploadProgressContainer');
        const progFill = document.getElementById('uploadProgressBar');
        progContainer.style.display = 'block';
        progFill.style.width = '30%';

        try {
          const { error: uploadError } = await supabaseClient.storage.from('notes').upload(filePath, file);
          if (uploadError) throw uploadError;
          progFill.style.width = '90%';

          const { data: { publicUrl } } = supabaseClient.storage.from('notes').getPublicUrl(filePath);
          noteData.fileUrl = publicUrl;
          noteData.fileType = file.type;
          noteData.fileName = file.name;
          progFill.style.width = '100%';
        } catch (err) {
          alert('File upload failed: ' + err.message);
          submitBtn.disabled = false;
          progContainer.style.display = 'none';
          return;
        }
      } else if (editingNoteId) {
        noteData.fileUrl = currentFileUrl;
      }

      try {
        if (editingNoteId) {
          await db.collection('notes').doc(editingNoteId).update(noteData);
          alert('Note updated successfully!');
        } else {
          noteData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('notes').add(noteData);
          alert('Note added successfully!');
        }
        formHasUnsavedChanges = false;
        localStorage.removeItem('boom_admin_draft');
        clearForm();
        loadAdminNotes();
      } catch (err) {
        alert('Error saving note: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        document.getElementById('uploadProgressContainer').style.display = 'none';
      }
    });

    async function deleteNote(id) {
      if (confirm('Are you sure you want to delete this note?')) {
        try {
          await db.collection('notes').doc(id).delete();
          loadAdminNotes();
          alert('Note deleted.');
        } catch (err) {
          alert('Error deleting note.');
        }
      }
    }
  </script>
</body>
</html>
