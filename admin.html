<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin | Boom AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>

  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>

  <style>
    /* Page-specific layout only. */
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: var(--sp-4); }
    #main-content { width: 100%; max-width: 1100px; flex: 1; }

    .login-section, .dashboard-section { display: none; padding: var(--sp-5); }
    .login-section.active, .dashboard-section.active { display: block; }
    .login-section { max-width: 420px; margin: var(--sp-7) auto 0; }
    .login-section h1 { margin: 0 0 var(--sp-5); font-size: var(--fs-5); }
    @media (min-width: 768px) { .dashboard-section { padding: var(--sp-6); } }

    .dash-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-5); }
    .dash-head h1 { margin: 0; font-size: var(--fs-5); }

    .field { display: block; margin-bottom: var(--sp-3); }
    .field > label, .field > span { display: block; margin-bottom: var(--sp-1); font-size: var(--fs-2); font-weight: var(--fw-semibold); }
    .field input, .field select { width: 100%; }
    .field-row { display: grid; gap: var(--sp-3); }
    @media (min-width: 560px) { .field-row.cols-3 { grid-template-columns: repeat(3, 1fr); } }

    .password-group { position: relative; }
    .password-group input { padding-right: var(--tap); }
    .password-toggle { position: absolute; right: 0; top: 0; border: 0; background: transparent; }
    .error { margin: var(--sp-3) 0 0; color: var(--danger); font-size: var(--fs-2); font-weight: var(--fw-semibold); }
    .error:empty { display: none; }

    .admin-workspace { display: grid; gap: var(--sp-5); }
    @media (min-width: 900px) { .admin-workspace { grid-template-columns: 1fr 1fr; align-items: start; } }

    /* Editor: toolbar + writing area read as one control (concentric radii) */
    .editor-toolbar { display: flex; flex-wrap: wrap; gap: var(--sp-1); padding: var(--sp-1); border: 1px solid var(--text-muted); border-bottom: 0; border-radius: var(--r-sm) var(--r-sm) 0 0; background: var(--surface-2); }
    .editor-toolbar button, .editor-toolbar select { min-height: var(--tap); min-width: var(--tap); border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--text); font: inherit; font-size: var(--fs-2); cursor: pointer; padding: 0 var(--sp-2); }
    .editor-toolbar button:hover, .editor-toolbar select:hover { background: var(--accent); color: var(--on-accent); }
    .editor-toolbar select { max-width: 9rem; }
    .editor-content-area { min-height: 200px; max-height: 350px; overflow-y: auto; padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-1); border: 1px solid var(--text-muted); border-radius: 0 0 var(--r-sm) var(--r-sm); background: var(--surface); color: var(--text); }
    .editor-content-area:focus { border-color: var(--accent); outline: none; }
    .editor-content-area:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .editor-content-area:empty::before { content: attr(data-placeholder); color: var(--text-muted); }
    .char-counter { font-size: var(--fs-1); color: var(--text-muted); text-align: right; margin-bottom: var(--sp-3); }

    .check { display: flex; align-items: center; gap: var(--sp-3); min-height: var(--tap); font-size: var(--fs-2); cursor: pointer; }
    .check input { width: 20px; height: 20px; accent-color: var(--accent); }
    .attachment-box { margin: var(--sp-3) 0; padding: var(--sp-3); border-radius: var(--r-sm); background: var(--surface-2); font-size: var(--fs-2); }

    .progress-bar-container { display: none; height: var(--sp-2); margin: var(--sp-3) 0; border-radius: var(--r-pill); background: var(--surface-2); overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: var(--accent); transition: width var(--dur-med) var(--ease); }
    .last-saved-timestamp { margin: var(--sp-1) 0 var(--sp-3); font-size: var(--fs-1); color: var(--text-muted); text-align: right; }
    .form-actions { display: flex; gap: var(--sp-3); flex-wrap: wrap; }
    .form-actions .btn-primary { flex: 2 1 12rem; }
    .form-actions .btn:not(.btn-primary) { flex: 1 1 6rem; }

    .preview-pane { padding: var(--sp-4); border: 1px solid var(--border); border-radius: var(--r-inner-lg); background: var(--surface-2); max-height: 560px; overflow-y: auto; }
    @media (min-width: 900px) { .preview-pane { position: sticky; top: var(--sp-4); } }
    .preview-pane h2 { margin: 0 0 var(--sp-3); padding-bottom: var(--sp-2); border-bottom: 1px solid var(--border); font-size: var(--fs-2); color: var(--text-muted); }
    #livePreviewContent { overflow-wrap: anywhere; }
    #livePreviewContent .pv-topic { margin: 0; font-size: var(--fs-4); }
    #livePreviewContent .pv-sub { margin: var(--sp-1) 0 0; font-size: var(--fs-2); color: var(--text-muted); }
    #livePreviewContent .pv-title { margin: var(--sp-3) 0 var(--sp-2); font-size: var(--fs-3); }

    .list-section { margin-top: var(--sp-6); padding-top: var(--sp-5); border-top: 1px solid var(--border); }
    .list-section h2 { margin: 0 0 var(--sp-3); font-size: var(--fs-4); }
    .subject-counter-summary { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-4); }
    .count-chip { display: inline-flex; gap: var(--sp-2); padding: var(--sp-1) var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-pill); font-size: var(--fs-1); }
    .count-chip b { font-weight: var(--fw-bold); }
    .admin-filter-bar { display: grid; gap: var(--sp-3); margin-bottom: var(--sp-4); }
    @media (min-width: 768px) { .admin-filter-bar { grid-template-columns: 2fr 1fr 1fr; } }

    .note-list { display: grid; gap: var(--sp-2); max-height: 480px; overflow-y: auto; }
    .note-list .note-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border: 1px solid var(--border); border-radius: var(--r-inner-lg); background: var(--surface-2); }
    .note-row .info { min-width: 0; overflow-wrap: anywhere; }
    .note-row .info small { display: block; margin-top: var(--sp-1); color: var(--text-muted); font-size: var(--fs-1); }
    .note-row .actions { display: flex; gap: var(--sp-1); flex: none; }
    .icon-btn.is-loading .fas { display: none; }
    .icon-btn.danger { color: var(--danger); }
    .icon-btn.danger:hover { background: var(--danger); color: var(--bg); }

    .footer { margin-top: var(--sp-7); padding: var(--sp-5) 0 var(--sp-2); }
  </style>
</head>

<body>
  <main id="main-content">

    <!-- Login -->
    <section class="card login-section active" id="login-section">
      <h1>Admin login</h1>
      <form id="login-form" onsubmit="login(event)" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-group">
            <input type="password" id="password" autocomplete="current-password" required>
            <button type="button" class="icon-btn password-toggle" id="togglePassword" onclick="togglePasswordVisibility()" aria-label="Show password"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="login-button" style="width:100%;">Log in</button>
      </form>
      <p class="error" id="login-error" role="alert"></p>
    </section>

    <!-- Dashboard -->
    <section class="card dashboard-section" id="dashboard-section">
      <div class="dash-head">
        <h1>Admin dashboard</h1>
        <button type="button" class="btn btn-sm" onclick="logout()"><i class="fas fa-right-from-bracket" aria-hidden="true"></i> Log out</button>
      </div>

      <div class="admin-workspace">
        <form id="note-form">
          <div class="field-row cols-3">
            <div class="field"><label for="note-topic">Topic</label><input type="text" id="note-topic" placeholder="e.g. Algebra" required oninput="triggerAutosave(); updateLivePreview();"></div>
            <div class="field"><label for="sub-topic">Subtopic</label><input type="text" id="sub-topic" placeholder="e.g. Quadratic equations" required oninput="triggerAutosave(); updateLivePreview();"></div>
            <div class="field"><label for="note-title">Title</label><input type="text" id="note-title" maxlength="60" required oninput="updateCharCount(); triggerAutosave(); updateLivePreview();"></div>
          </div>
          <div class="char-counter" id="charCounter">0 / 60 characters</div>

          <div class="editor-toolbar" role="toolbar" aria-label="Text formatting">
            <button type="button" onclick="formatText('bold')" aria-label="Bold" title="Bold"><i class="fas fa-bold"></i></button>
            <button type="button" onclick="formatText('italic')" aria-label="Italic" title="Italic"><i class="fas fa-italic"></i></button>
            <button type="button" onclick="formatText('underline')" aria-label="Underline" title="Underline"><i class="fas fa-underline"></i></button>
            <button type="button" onclick="formatText('strikeThrough')" aria-label="Strikethrough" title="Strikethrough"><i class="fas fa-strikethrough"></i></button>
            <select onchange="changeFontSize(this.value)" aria-label="Letter size" title="Letter size">
              <option value="" disabled selected>Size</option>
              <option value="1">Small</option>
              <option value="3">Normal</option>
              <option value="5">Large</option>
              <option value="7">Extra large</option>
            </select>
            <button type="button" onclick="formatText('formatBlock', 'H2')" aria-label="Heading" title="Heading"><i class="fas fa-heading"></i></button>
            <button type="button" onclick="formatText('insertUnorderedList')" aria-label="Bullet list" title="Bullet list"><i class="fas fa-list-ul"></i></button>
            <button type="button" onclick="formatText('insertOrderedList')" aria-label="Numbered list" title="Numbered list"><i class="fas fa-list-ol"></i></button>
            <button type="button" onclick="formatText('justifyLeft')" aria-label="Align left" title="Align left"><i class="fas fa-align-left"></i></button>
            <button type="button" onclick="formatText('justifyCenter')" aria-label="Align centre" title="Align centre"><i class="fas fa-align-center"></i></button>
            <button type="button" onclick="formatText('removeFormat')" aria-label="Clear formatting" title="Clear formatting"><i class="fas fa-eraser"></i></button>
          </div>
          <div id="content" class="editor-content-area" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Note content" data-placeholder="Type the note here" oninput="triggerAutosave(); updateLivePreview();"></div>

          <div class="field-row cols-3" style="margin-top: var(--sp-3);">
            <div class="field">
              <label for="grade">Grade</label>
              <select id="grade" required onchange="updateSubjectDropdown(); saveLastSubjectGrade(); triggerAutosave();">
                <option value="" disabled selected>Select grade</option>
                <option value="Grade 7">Grade 7</option>
                <option value="Grade 8">Grade 8</option>
                <option value="Grade 9">Grade 9</option>
                <option value="Grade 10">Grade 10 (Senior School)</option>
              </select>
            </div>
            <div class="field">
              <label for="subject">Subject</label>
              <select id="subject" required onchange="saveLastSubjectGrade(); triggerAutosave();">
                <option value="" disabled selected>Select grade first</option>
              </select>
            </div>
            <div class="field">
              <label for="contentType">Content type</label>
              <select id="contentType" required onchange="triggerAutosave()">
                <option value="Notes" selected>Notes</option>
                <option value="Revision">Revision guide</option>
                <option value="Exam">Exam practice</option>
              </select>
            </div>
          </div>

          <label class="check"><input type="checkbox" id="isPinned" onchange="triggerAutosave()"> Pin this note to the top</label>

          <div id="current-attachment-box" class="attachment-box" style="display:none;">
            <strong>Current attachment:</strong> <a id="current-attachment-link" href="#" target="_blank" rel="noopener">View file</a>
            <label class="check"><input type="checkbox" id="removeFileCheckbox"> Remove attached file</label>
          </div>

          <div class="field">
            <label for="fileInput">Attachment (PDF or image, up to 10 MB)</label>
            <input type="file" id="fileInput" accept="application/pdf,image/*" onchange="validateFile(this)">
          </div>
          <div class="progress-bar-container" id="uploadProgressContainer" role="progressbar" aria-label="Upload progress">
            <div class="progress-bar-fill" id="uploadProgressBar"></div>
          </div>

          <div class="last-saved-timestamp" id="lastSavedTimestamp" aria-live="polite">Draft not saved yet</div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submit-button"><i class="fas fa-upload" aria-hidden="true"></i> Upload Note</button>
            <button type="button" class="btn" onclick="clearForm()">Clear</button>
            <button type="button" class="btn" id="cancel-edit-button" style="display:none;" onclick="cancelEdit()">Cancel edit</button>
          </div>
        </form>

        <aside class="preview-pane" aria-label="Live preview">
          <h2>Live preview</h2>
          <div id="livePreviewContent"><p class="pv-sub">The preview appears as you type.</p></div>
        </aside>
      </div>

      <div class="list-section">
        <h2>Uploaded notes</h2>
        <div class="subject-counter-summary" id="subjectCounterSummary" aria-label="Notes per subject"></div>

        <div class="admin-filter-bar">
          <input type="search" id="adminSearchInput" placeholder="Search uploaded notes" aria-label="Search uploaded notes" oninput="filterAdminNotes()">
          <select id="adminSubjectFilter" onchange="filterAdminNotes()" aria-label="Filter by subject">
            <option value="">All subjects</option>
            <option value="mathematics">Mathematics</option>
            <option value="english">English</option>
            <option value="kiswahili">Kiswahili</option>
            <option value="integrated-science">Integrated Science</option>
            <option value="social-studies">Social Studies</option>
            <option value="cre">CRE</option>
            <option value="pre-technical">Pre-Technical</option>
            <option value="agriculture-nutrition">Agriculture and Nutrition</option>
            <option value="creative-arts-sports">Creative Arts and Sports</option>
            <option value="core-mathematics">Core Mathematics</option>
            <option value="essential-mathematics">Essential Mathematics</option>
            <option value="biology">Biology</option>
            <option value="chemistry">Chemistry</option>
            <option value="physics">Physics</option>
            <option value="computer-studies">Computer Studies</option>
            <option value="business-studies">Business Studies</option>
          </select>
          <select id="adminGradeFilter" onchange="filterAdminNotes()" aria-label="Filter by grade">
            <option value="">All grades</option>
            <option value="Grade 7">Grade 7</option>
            <option value="Grade 8">Grade 8</option>
            <option value="Grade 9">Grade 9</option>
            <option value="Grade 10">Grade 10</option>
          </select>
        </div>

        <div class="note-list" id="note-list" aria-live="polite"></div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>&copy; 2026 Boom AI. Powered by Pope John.</p>
  </footer>

    // Escape text before it goes into innerHTML
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    ];

    auth.onAuthStateChanged(user => {
      if (user) {
        showDashboard();
        resetIdleTimer();
      } else {
        showLogin();
      }
    });

    function resetIdleTimer() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        auth.signOut().then(() => {
          showToast('You were logged out after 30 minutes of inactivity.', 5000);
          showLogin();
        });
      }, 30 * 60 * 1000);
    }

    window.addEventListener('mousemove', resetIdleTimer);
    window.addEventListener('keypress', resetIdleTimer);

    document.addEventListener('DOMContentLoaded', () => {
      const savedEmail = localStorage.getItem('boom_admin_email');
      if (savedEmail) {
        document.getElementById('email').value = savedEmail;
      }
      loadLastSubjectGrade();
      loadDraftFromBrowser();
    });

    function togglePasswordVisibility() {
      const passField = document.getElementById('password');
      const btn = document.getElementById('togglePassword');
      const icon = btn.querySelector('i');
      if (passField.type === 'password') {
        passField.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
        btn.setAttribute('aria-label', 'Hide password');
      } else {
        passField.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
        btn.setAttribute('aria-label', 'Show password');
      }
    }

    async function login(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-button');
      const errorEl = document.getElementById('login-error');
      errorEl.textContent = '';
      setLoading(btn, true);

      try {
        await auth.signInWithEmailAndPassword(email, password);
        localStorage.setItem('boom_admin_email', email);
        showDashboard();
      } catch (err) {
        errorEl.textContent = err.message;
      } finally {
        setLoading(btn, false);
      }
    }

    function logout() { auth.signOut(); }
    function showLogin() {
      document.getElementById('login-section').classList.add('active');
      document.getElementById('dashboard-section').classList.remove('active');
    }
    function showDashboard() {
      document.getElementById('login-section').classList.remove('active');
      document.getElementById('dashboard-section').classList.add('active');
      loadAdminNotes();
    }

    function formatText(command, value = null) {
      document.execCommand(command, false, value);
      triggerAutosave();
      updateLivePreview();
    }

    function changeFontSize(size) {
      document.execCommand('fontSize', false, size);
      triggerAutosave();
      updateLivePreview();
    }

    function updateSubjectDropdown(selectedSubj = '') {
      const grade = document.getElementById('grade').value;
      const subjectSelect = document.getElementById('subject');
      subjectSelect.innerHTML = '<option value="" disabled selected>Select subject</option>';

      if (grade === 'Grade 10') {
        seniorSchoolCategoriesList.forEach(cat => {
          const optgroup = document.createElement('optgroup');
          optgroup.label = cat.category;
          cat.subjects.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = s.name;
            if (s.id === selectedSubj) opt.selected = true;
            optgroup.appendChild(opt);
          });
          subjectSelect.appendChild(optgroup);
        });
      } else if (['Grade 7', 'Grade 8', 'Grade 9'].includes(grade)) {
        juniorSubjectsList.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = s.name;
          if (s.id === selectedSubj) opt.selected = true;
          subjectSelect.appendChild(opt);
        });
      }
    }

    function saveLastSubjectGrade() {
      const subj = document.getElementById('subject').value;
      const grade = document.getElementById('grade').value;
      if (subj) localStorage.setItem('boom_last_admin_subject', subj);
      if (grade) localStorage.setItem('boom_last_admin_grade', grade);
    }

    function loadLastSubjectGrade() {
      const lastGrade = localStorage.getItem('boom_last_admin_grade');
      const lastSubj = localStorage.getItem('boom_last_admin_subject');
      if (lastGrade && !editingNoteId) {
        document.getElementById('grade').value = lastGrade;
        updateSubjectDropdown(lastSubj);
      }
    }

    window.addEventListener('beforeunload', (e) => {
      if (formHasUnsavedChanges) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    function markFormChanged() { formHasUnsavedChanges = true; }

    function updateCharCount() {
      const title = document.getElementById('note-title').value;
      document.getElementById('charCounter').textContent = `${title.length} / 60 characters`;
      markFormChanged();
    }

    function updateLivePreview() {
      const topic = document.getElementById('note-topic').value;
      const subtopic = document.getElementById('sub-topic').value;
      const title = document.getElementById('note-title').value;
      const content = document.getElementById('content').innerHTML;

      document.getElementById('livePreviewContent').innerHTML = `
        <h3 class="pv-topic">${esc(topic) || 'Topic'}</h3>
        <p class="pv-sub">${esc(subtopic)}</p>
        <h4 class="pv-title">${esc(title) || 'Title'}</h4>
        <div>${content || '<p class="pv-sub">The note text appears here.</p>'}</div>
      `;
      markFormChanged();
    }

    function triggerAutosave() {
      const draft = {
        topic: document.getElementById('note-topic').value,
        subtopic: document.getElementById('sub-topic').value,
        title: document.getElementById('note-title').value,
        content: document.getElementById('content').innerHTML,
        contentType: document.getElementById('contentType').value,
        subject: document.getElementById('subject').value,
        grade: document.getElementById('grade').value,
        isPinned: document.getElementById('isPinned').checked
      };
      localStorage.setItem('boom_admin_draft', JSON.stringify(draft));
      const nowStr = new Date().toLocaleTimeString();
      document.getElementById('lastSavedTimestamp').textContent = `Draft saved at ${nowStr}`;
    }

    function loadDraftFromBrowser() {
      const saved = localStorage.getItem('boom_admin_draft');
      if (saved && !editingNoteId) {
        try {
          const d = JSON.parse(saved);
          document.getElementById('note-topic').value = d.topic || '';
          document.getElementById('sub-topic').value = d.subtopic || '';
          document.getElementById('note-title').value = d.title || '';
          document.getElementById('content').innerHTML = d.content || '';
          if (d.contentType) document.getElementById('contentType').value = d.contentType;
          if (d.grade) {
            document.getElementById('grade').value = d.grade;
            updateSubjectDropdown(d.subject);
          }
          document.getElementById('isPinned').checked = !!d.isPinned;
          updateCharCount();
          updateLivePreview();
        } catch(e){}
      }
    }

    function validateFile(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const maxSize = 10 * 1024 * 1024;
        if (file.size > maxSize) {
          showToast('That file is too large. The limit is 10 MB.', 4000);
          input.value = '';
          return;
        }
        if (!['application/pdf', 'image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
          showToast('Only PDF, JPG, PNG or WebP files are allowed.', 4000);
          input.value = '';
          return;
        }
      }
    }

    function clearForm() {
      document.getElementById('note-form').reset();
      document.getElementById('content').innerHTML = '';
      document.getElementById('current-attachment-box').style.display = 'none';
      editingNoteId = null;
      currentFileUrl = null;
      localStorage.removeItem('boom_admin_draft');
      loadLastSubjectGrade();
      document.getElementById('lastSavedTimestamp').textContent = 'Form cleared';
      document.getElementById('submit-button').innerHTML = '<i class="fas fa-upload" aria-hidden="true"></i> Upload Note';
      document.getElementById('cancel-edit-button').style.display = 'none';
      formHasUnsavedChanges = false;
      updateLivePreview();
      updateCharCount();
      formHasUnsavedChanges = false;
    }

    function listState(message, buttonLabel, onClick) {
      const list = document.getElementById('note-list');
      list.innerHTML = `<div class="state-block"><p>${esc(message)}</p>` +
        (buttonLabel ? `<button type="button" class="btn btn-primary" id="listStateBtn">${esc(buttonLabel)}</button>` : '') + '</div>';
      if (buttonLabel) document.getElementById('listStateBtn').addEventListener('click', onClick);
    }

    async function loadAdminNotes() {
      const listContainer = document.getElementById('note-list');
      listContainer.innerHTML = '<div class="skeleton skeleton-card" style="height:72px; margin:0;"></div>'.repeat(3);

      try {
        const snapshot = await db.collection('notes').orderBy('createdAt', 'desc').get();
        allAdminNotes = [];
        const counts = {};

        snapshot.forEach(doc => {
          const data = doc.data();
          allAdminNotes.push({ id: doc.id, ...data });
          counts[data.subject] = (counts[data.subject] || 0) + 1;
        });

        renderSubjectCounters(counts);
        renderAdminNotesList(allAdminNotes);
      } catch (err) {
        listState('Notes could not load. Check the connection and try again.', 'Try again', loadAdminNotes);
      }
    }

    function renderSubjectCounters(counts) {
      const summary = document.getElementById('subjectCounterSummary');
      const subjects = ['mathematics', 'english', 'kiswahili', 'integrated-science', 'social-studies', 'cre', 'pre-technical', 'agriculture-nutrition', 'creative-arts-sports', 'core-mathematics', 'essential-mathematics', 'biology', 'chemistry', 'physics', 'computer-studies', 'business-studies'];
      summary.innerHTML = subjects.map(s => `<span class="count-chip"><span>${s.replace(/-/g, ' ')}</span><b class="num">${counts[s] || 0}</b></span>`).join('');
    }

    function renderAdminNotesList(notes) {
      const listContainer = document.getElementById('note-list');
      if (notes.length === 0) {
        if (allAdminNotes.length === 0) {
          listState('No notes yet. Fill in the form above to upload the first one.');
        } else {
          listState('No notes match these filters.', 'Clear filters', () => {
            document.getElementById('adminSearchInput').value = '';
            document.getElementById('adminSubjectFilter').value = '';
            document.getElementById('adminGradeFilter').value = '';
            filterAdminNotes();
          });
        }
        return;
      }

      listContainer.innerHTML = notes.map(n => `
        <div class="note-row">
          <div class="info">
            ${n.isPinned ? '<i class="fas fa-thumbtack" style="color:var(--accent);" aria-hidden="true"></i><span class="visually-hidden">Pinned. </span> ' : ''}<strong>${esc(n.noteTopic)}</strong>, ${esc(n.noteTitle)}
            <small>${esc(n.subject)}, ${esc(n.grade)}, ${esc(n.contentType || 'Notes')}</small>
          </div>
          <div class="actions">
            <button type="button" class="icon-btn" onclick="duplicateNote('${n.id}')" aria-label="Duplicate note" title="Duplicate"><i class="fas fa-copy"></i></button>
            <button type="button" class="icon-btn" onclick="editNote('${n.id}')" aria-label="Edit note" title="Edit"><i class="fas fa-pen"></i></button>
            <button type="button" class="icon-btn danger" onclick="deleteNote('${n.id}', this)" aria-label="Delete note" title="Delete"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    }

    function filterAdminNotes() {
      const search = document.getElementById('adminSearchInput').value.toLowerCase();
      const subject = document.getElementById('adminSubjectFilter').value;
      const grade = document.getElementById('adminGradeFilter').value;

      const filtered = allAdminNotes.filter(n => {
        const matchesSearch = (n.noteTopic || '').toLowerCase().includes(search) || (n.noteTitle || '').toLowerCase().includes(search);
        const matchesSubj = !subject || n.subject === subject;
        const matchesGrade = !grade || n.grade === grade;
        return matchesSearch && matchesSubj && matchesGrade;
      });

      renderAdminNotesList(filtered);
    }

    function duplicateNote(id) {
      const note = allAdminNotes.find(n => n.id === id);
      if (!note) return;

      document.getElementById('note-topic').value = note.noteTopic + ' (Copy)';
      document.getElementById('sub-topic').value = note.subTopic || '';
      document.getElementById('note-title').value = note.noteTitle || '';
      document.getElementById('content').innerHTML = note.content || '';
      document.getElementById('contentType').value = note.contentType || 'Notes';
      document.getElementById('grade').value = note.grade || '';
      updateSubjectDropdown(note.subject);
      document.getElementById('isPinned').checked = !!note.isPinned;

      editingNoteId = null;
      currentFileUrl = null;
      document.getElementById('current-attachment-box').style.display = 'none';
      document.getElementById('submit-button').innerHTML = '<i class="fas fa-upload" aria-hidden="true"></i> Upload Note (Duplicate)';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      updateCharCount();
      updateLivePreview();
      markFormChanged();
      showToast('Copied into the form. Edit it and upload.');
    }

    async function editNote(id) {
      const note = allAdminNotes.find(n => n.id === id);
      if (!note) return;

      document.getElementById('note-topic').value = note.noteTopic || '';
      document.getElementById('sub-topic').value = note.subTopic || '';
      document.getElementById('note-title').value = note.noteTitle || '';
      document.getElementById('content').innerHTML = note.content || '';
      document.getElementById('contentType').value = note.contentType || 'Notes';
      document.getElementById('grade').value = note.grade || '';
      updateSubjectDropdown(note.subject);
      document.getElementById('isPinned').checked = !!note.isPinned;

      editingNoteId = id;
      currentFileUrl = note.fileUrl || null;

      if (currentFileUrl) {
        document.getElementById('current-attachment-link').href = currentFileUrl;
        document.getElementById('current-attachment-box').style.display = 'block';
        document.getElementById('removeFileCheckbox').checked = false;
      } else {
        document.getElementById('current-attachment-box').style.display = 'none';
      }

      document.getElementById('submit-button').innerHTML = '<i class="fas fa-floppy-disk" aria-hidden="true"></i> Save Changes';
      document.getElementById('cancel-edit-button').style.display = 'inline-flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      updateCharCount();
      updateLivePreview();
    }

    function cancelEdit() { clearForm(); }

    document.getElementById('note-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-button');
      setLoading(submitBtn, true);

      const noteData = {
        noteTopic: document.getElementById('note-topic').value.trim(),
        subTopic: document.getElementById('sub-topic').value.trim(),
        noteTitle: document.getElementById('note-title').value.trim(),
        content: document.getElementById('content').innerHTML,
        contentType: document.getElementById('contentType').value,
        subject: document.getElementById('subject').value,
        grade: document.getElementById('grade').value,
        isPinned: document.getElementById('isPinned').checked,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      const fileInput = document.getElementById('fileInput');
      const removeFile = document.getElementById('removeFileCheckbox').checked;

      if (removeFile) {
        noteData.fileUrl = null;
        noteData.fileType = null;
        noteData.fileName = null;
      } else if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const filePath = `notes/${Date.now()}-${file.name}`;

        const progContainer = document.getElementById('uploadProgressContainer');
        const progFill = document.getElementById('uploadProgressBar');
        progContainer.style.display = 'block';
        progFill.style.width = '30%';

        try {
          const { error: uploadError } = await supabaseClient.storage.from('notes').upload(filePath, file);
          if (uploadError) throw uploadError;
          progFill.style.width = '90%';

          const { data: { publicUrl } } = supabaseClient.storage.from('notes').getPublicUrl(filePath);
          noteData.fileUrl = publicUrl;
          noteData.fileType = file.type;
          noteData.fileName = file.name;
          progFill.style.width = '100%';
        } catch (err) {
          showToast('File upload failed: ' + err.message, 5000);
          setLoading(submitBtn, false);
          progContainer.style.display = 'none';
          return;
        }
      } else if (editingNoteId) {
        noteData.fileUrl = currentFileUrl;
      }

      try {
        if (editingNoteId) {
          await db.collection('notes').doc(editingNoteId).update(noteData);
          showToast('Note updated');
        } else {
          noteData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('notes').add(noteData);
          showToast('Note added');
        }
        formHasUnsavedChanges = false;
        localStorage.removeItem('boom_admin_draft');
        clearForm();
        loadAdminNotes();
      } catch (err) {
        showToast('Error saving note: ' + err.message, 5000);
      } finally {
        setLoading(submitBtn, false);
        document.getElementById('uploadProgressContainer').style.display = 'none';
      }
    });

    async function deleteNote(id, btn) {
      if (confirm('Are you sure you want to delete this note?')) {
        setLoading(btn, true);
        try {
          await db.collection('notes').doc(id).delete();
          showToast('Note deleted');
          loadAdminNotes();
        } catch (err) {
          setLoading(btn, false);
          showToast('The note could not be deleted. Please try again.', 4000);
        }
      }
    }
  </script>
</body>
</html>
