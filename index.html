<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boom AI - CBC Learning Platform</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        .moe-logo { position: absolute; top: 20px; left: 20px; height: 50px; z-index: 10; }
        
        .home-container {
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px var(--shadow-color);
        }
        h1 {
            font-weight: 700;
            font-size: 2.8rem;
            margin-bottom: 15px;
            color: var(--heading-color);
        }
        p.subtitle {
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0.9;
            color: var(--text-color);
        }

        /* Word of the Day Widget on Home */
        .home-word-card {
            background: var(--button-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 30px;
            text-align: left;
            color: var(--text-color);
        }
        .home-word-card strong {
            color: var(--heading-color);
            display: block;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 35px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            background: var(--button-hover-bg);
            color: var(--button-hover-text);
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .cta-button:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .footer { margin-top: 30px; text-align: center; font-size: 0.9rem; color: var(--text-color); opacity: 0.8; }
    </style>
</head>
<body>
    <div class="background-aurora">
        <div class="aurora-shape shape1"></div>
        <div class="aurora-shape shape2"></div>
        <div class="aurora-shape shape3"></div>
    </div>
    
    <div class="theme-switcher">
        <button class="theme-button" data-theme="dark" aria-label="Dark theme"><i class="fas fa-moon"></i></button>
        <button class="theme-button" data-theme="light" aria-label="Light theme"><i class="fas fa-sun"></i></button>
        <button class="theme-button" data-theme="sepia" aria-label="Sepia theme"><i class="fas fa-book-open"></i></button>
        <button class="theme-button" data-theme="midnight" aria-label="Midnight theme"><i class="fas fa-star-of-david"></i></button>
        <button class="theme-button" data-theme="ocean" aria-label="Ocean theme"><i class="fas fa-water"></i></button>
        <button class="theme-button" data-theme="forest" aria-label="Forest theme"><i class="fas fa-leaf"></i></button>
        <button class="theme-button" data-theme="rose" aria-label="Rose theme"><i class="fas fa-spa"></i></button>
    </div>

    <img src="moe-logo.webp" alt="Ministry of Education Logo" class="moe-logo">

    <div class="home-container">
        <h1>Boom AI</h1>
        <p class="subtitle">Empowering Grade 7–9 CBC Learners with Smart Notes, Practice Tools & Interactive Study Guides.</p>

        <!-- Word of the Day Widget -->
        <div class="home-word-card">
            <strong><i class="fas fa-language" style="color: var(--accent-color-1);"></i> Word of the Day / Neno la Leo</strong>
            <span id="word-of-day">Loading vocabulary...</span>
        </div>

        <a href="landing.html" class="cta-button">
            Get Started <i class="fas fa-arrow-right"></i>
        </a>
    </div>

    <footer class="footer">
        <p>&copy; 2026 Boom AI. Powered by Pope John.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadWordOfTheDay();

            window.addEventListener('scroll', () => {
                const switcher = document.querySelector('.theme-switcher');
                if (window.scrollY > 50 && switcher) {
                    switcher.style.opacity = '0.3';
                } else if (switcher) {
                    switcher.style.opacity = '1';
                }
            });
        });

        function loadWordOfTheDay() {
            const words = [
                { en: "Curiosity (Eagerness to know)", sw: "Udadisi (Hamu ya kujua)" },
                { en: "Resilience (Ability to recover quickly)", sw: "Uvumilivu (Uwezo wa kustahimili)" },
                { en: "Innovation (Introducing new ideas)", sw: "Ubunifu (Kuvumbua mambo mapya)" },
                { en: "Knowledge (Information and skills)", sw: "Maarifa (Ujuzi na ufahamu)" }
            ];
            const dayIndex = new Date().getDate() % words.length;
            const w = words[dayIndex];
            document.getElementById('word-of-day').textContent = `EN: ${w.en} | SW: ${w.sw}`;
        }
    </script>
</body>
</html>
