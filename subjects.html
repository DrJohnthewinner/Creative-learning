<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Subject | Boom AI</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }
    .logo-container { position: absolute; top: 20px; left: 20px; z-index: 10; }
    .logo-container img { height: 50px; width: auto; }
    
    #main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
      width: 100%;
      max-width: 900px;
      margin-top: 40px;
      flex-grow: 1;
    }
    #subjects-page {
      border-radius: 25px;
      padding: 40px 30px;
      width: 100%;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
    }
    h2 { font-weight: 600; font-size: 2.3rem; margin-bottom: 20px; color: var(--heading-color); }
    
    .streak-banner {
      background: var(--button-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 25px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      color: var(--text-color);
    }

    .subject-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .subject-card {
      background: var(--button-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 15px;
      text-align: left;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .subject-card:hover {
      background: var(--button-hover-bg);
      color: var(--button-hover-text);
      transform: translateY(-3px);
    }
    .subject-card-title { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    
    .progress-container { width: 100%; background: rgba(255,255,255,0.1); border-radius: 10px; height: 8px; overflow: hidden; margin-top: 10px; }
    .progress-fill { height: 100%; background: var(--accent-color-1); width: 0%; transition: width 0.4s ease; }
    .progress-text { font-size: 0.75rem; opacity: 0.8; margin-top: 4px; text-align: right; display: block; }

    .back-button { padding: 10px 20px; border-radius: 12px; font-size: 0.95rem; cursor: pointer; margin-bottom: 20px; }

    .milestone-toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #00c853; color: #fff; padding: 12px 25px; border-radius: 30px;
      font-weight: 600; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 3000;
      display: none; animation: slideDown 0.4s ease;
    }
    @keyframes slideDown { from { top: -40px; opacity: 0; } to { top: 20px; opacity: 1; } }

    footer { text-align: center; padding: 15px; font-size: 0.9rem; opacity: 0.8; color: var(--text-color); width: 100%; }
  </style>
</head>
<body>
  <div class="background-aurora">
      <div class="aurora-shape shape1"></div>
      <div class="aurora-shape shape2"></div>
      <div class="aurora-shape shape3"></div>
  </div>

  <div class="milestone-toast" id="milestoneToast"><i class="fas fa-trophy"></i> Amazing! You hit a study milestone!</div>

  <div class="theme-switcher">
    <button class="theme-button" data-theme="dark" aria-label="Dark theme"><i class="fas fa-moon"></i></button>
    <button class="theme-button" data-theme="light" aria-label="Light theme"><i class="fas fa-sun"></i></button>
    <button class="theme-button" data-theme="sepia" aria-label="Sepia theme"><i class="fas fa-book-open"></i></button>
    <button class="theme-button" data-theme="midnight" aria-label="Midnight theme"><i class="fas fa-star-of-david"></i></button>
    <button class="theme-button" data-theme="ocean" aria-label="Ocean theme"><i class="fas fa-water"></i></button>
    <button class="theme-button" data-theme="forest" aria-label="Forest theme"><i class="fas fa-leaf"></i></button>
    <button class="theme-button" data-theme="rose" aria-label="Rose theme"><i class="fas fa-spa"></i></button>
  </div>

  <div class="logo-container">
    <img src="moe-logo.webp" alt="Ministry of Education Logo">
  </div>

  <div id="main-content">
    <section id="subjects-page">
      <button class="action-button back-button" onclick="window.location.href='landing.html'">
        <i class="fas fa-arrow-left"></i> Back to Grades
      </button>

      <div class="streak-banner" id="streakBanner">
        <i class="fas fa-fire" style="color: #ff9800; font-size: 1.2rem;"></i>
        <span id="streakCountText">Loading streak...</span>
      </div>

      <h2><i class="fas fa-book-open"></i> Select Subject for <span id="grade-display"></span></h2>
      
      <div class="subject-list" id="subject-list-container"></div>
    </section>
  </div>

  <footer>
    <p>&copy; 2026 Boom AI. Powered by Pope John</p>
  </footer>

  <script>
    const firebaseConfig = {
        apiKey: "AIzaSyABCpgwLNKvUxdYtnz5HBHH9IlnDZgEbUo",
        authDomain: "creative-learning-f2252.firebaseapp.com",
        projectId: "creative-learning-f2252",
        storageBucket: "creative-learning-f2252.appspot.com",
        messagingSenderId: "451756350336",
        appId: "1:451756350336:web:19b9255b8834a01f4cff65"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    const subjectsConfig = [
      { id: 'mathematics', name: 'Mathematics', icon: 'fas fa-square-root-alt' },
      { id: 'english', name: 'English', icon: 'fas fa-language' },
      { id: 'kiswahili', name: 'Kiswahili', icon: 'fas fa-comments' },
      { id: 'integrated-science', name: 'Integrated Science', icon: 'fas fa-flask' },
      { id: 'social-studies', name: 'Social Studies', icon: 'fas fa-globe-americas' },
      { id: 'cre', name: 'Christian Religious Education', icon: 'fas fa-church' },
      { id: 'pre-technical', name: 'Pre-Technical', icon: 'fas fa-cogs' },
      { id: 'agriculture-nutrition', name: 'Agriculture and Nutrition', icon: 'fas fa-seedling' },
      { id: 'creative-arts-sports', name: 'Creative Arts and Sports', icon: 'fas fa-palette' }
    ];

    document.addEventListener('DOMContentLoaded', async function () {
      const grade = localStorage.getItem('selectedGrade') || 'Grade 8';
      document.getElementById('grade-display').textContent = grade;

      checkStreakAndMilestones();
      renderSubjectCardsSkeleton();
      await loadSubjectProgress(grade);

      window.addEventListener('scroll', () => {
        const switcher = document.querySelector('.theme-switcher');
        if (window.scrollY > 50 && switcher) {
          switcher.style.opacity = '0.3';
        } else if (switcher) {
          switcher.style.opacity = '1';
        }
      });
    });

    function checkStreakAndMilestones() {
      const today = new Date().toDateString();
      let streakData = JSON.parse(localStorage.getItem('boom_streak') || '{}');
      
      if (streakData.lastDate !== today) {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        
        if (streakData.lastDate === yesterday.toDateString()) {
          streakData.count = (streakData.count || 0) + 1;
        } else if (!streakData.lastDate) {
          streakData.count = 1;
        } else {
          streakData.count = 1;
        }
        streakData.lastDate = today;
        localStorage.setItem('boom_streak', JSON.stringify(streakData));

        if ([3, 7, 30].includes(streakData.count)) {
          showMilestoneToast(`🔥 Milestone Reached: ${streakData.count} Day Study Streak!`);
        }
      }
      document.getElementById('streakCountText').textContent = `${streakData.count} Day Study Streak 🔥`;
    }

    function showMilestoneToast(msg) {
      const toast = document.getElementById('milestoneToast');
      toast.innerHTML = `<i class="fas fa-trophy"></i> ${msg}`;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 5000);
    }

    function renderSubjectCardsSkeleton() {
      const container = document.getElementById('subject-list-container');
      container.innerHTML = subjectsConfig.map(s => `
        <div class="subject-card">
          <div class="subject-card-title"><i class="${s.icon}"></i> ${s.name}</div>
          <div class="progress-container"><div class="progress-fill" style="width: 0%;"></div></div>
          <span class="progress-text">Loading progress...</span>
        </div>
      `).join('');
    }

    async function loadSubjectProgress(grade) {
      const readNotes = JSON.parse(localStorage.getItem('boom_read_notes') || '[]');
      const container = document.getElementById('subject-list-container');

      try {
        const snapshot = await db.collection('notes').where('grade', '==', grade).get();
        const notesBySubject = {};

        snapshot.forEach(doc => {
          const data = doc.data();
          const subj = data.subject;
          if (!notesBySubject[subj]) notesBySubject[subj] = { total: 0, read: 0 };
          notesBySubject[subj].total++;
          if (readNotes.includes(doc.id)) {
            notesBySubject[subj].read++;
          }
        });

        container.innerHTML = subjectsConfig.map(s => {
          const stats = notesBySubject[s.id] || { total: 0, read: 0 };
          const percent = stats.total > 0 ? Math.round((stats.read / stats.total) * 100) : 0;
          return `
            <div class="subject-card" onclick="window.location.href='note.html?subject=${s.id}'">
              <div class="subject-card-title"><i class="${s.icon}"></i> ${s.name}</div>
              <div class="progress-container">
                <div class="progress-fill" style="width: ${percent}%;"></div>
              </div>
              <span class="progress-text">${stats.read} / ${stats.total} notes read (${percent}%)</span>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error("Error loading progress:", err);
      }
    }
  </script>
</body>
</html>
