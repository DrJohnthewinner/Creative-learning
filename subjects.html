<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a subject | Boom AI</title>

  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>

  <style>
    /* Page-specific layout only. */
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: var(--sp-4); position: relative; }
    .logo-container { position: absolute; top: var(--sp-4); left: var(--sp-4); }
    .logo-container img { height: var(--sp-7); width: auto; display: block; }

    #main-content { width: 100%; max-width: 1100px; flex: 1; padding-top: calc(var(--sp-7) * 2 + var(--sp-3)); }
    @media (min-width: 768px) { #main-content { padding-top: var(--sp-7); } }

    #subjects-page { padding: var(--sp-5); }
    @media (min-width: 768px) { #subjects-page { padding: var(--sp-6); } }

    .breadcrumb { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; font-size: var(--fs-2); color: var(--text-muted); margin-bottom: var(--sp-4); }
    .breadcrumb a { display: inline-flex; align-items: center; min-height: var(--tap); font-weight: var(--fw-semibold); }
    .breadcrumb .fa-chevron-right { font-size: var(--fs-1); }

    #subjects-page h1 { margin: 0 0 var(--sp-2); }
    .streak { margin: 0 0 var(--sp-5); font-size: var(--fs-2); color: var(--text-muted); }

    .pathway-section + .pathway-section { margin-top: var(--sp-6); }
    .pathway-title { font-size: var(--fs-4); margin: 0 0 var(--sp-3); }

    .subject-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--sp-3); }

    /* Subject card is a link: keyboard and long-press friendly */
    .subject-card {
      display: flex; flex-direction: column; gap: var(--sp-3);
      padding: var(--sp-4);
      color: var(--text); text-decoration: none;
      transition: border-color var(--dur-med) var(--ease), background var(--dur-med) var(--ease), transform var(--dur-fast) var(--ease);
    }
    .subject-card:hover { border-color: var(--accent); }
    .subject-card:active { transform: scale(0.98); }
    .subject-card-title { display: flex; align-items: center; gap: var(--sp-3); font-size: var(--fs-3); font-weight: var(--fw-semibold); color: var(--heading); }
    .subject-card-title .fas { width: var(--icon-button); text-align: center; font-size: var(--icon-button); color: var(--accent); }
    .progress-text { font-size: var(--fs-1); color: var(--text-muted); }

    .loading-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--sp-3); }
    .loading-grid .skeleton-card { height: 112px; margin: 0; }

    .footer { margin-top: var(--sp-7); padding: var(--sp-5) 0 var(--sp-2); }
  </style>
</head>
<body>
  <div class="theme-switcher">
    <button class="theme-button" data-theme="dark" aria-label="Dark theme"><i class="fas fa-moon"></i></button>
    <button class="theme-button" data-theme="light" aria-label="Light theme"><i class="fas fa-sun"></i></button>
    <button class="theme-button" data-theme="sepia" aria-label="Sepia theme"><i class="fas fa-book-open"></i></button>
    <button class="theme-button" data-theme="midnight" aria-label="Midnight theme"><i class="fas fa-star"></i></button>
    <button class="theme-button" data-theme="ocean" aria-label="Ocean theme"><i class="fas fa-water"></i></button>
    <button class="theme-button" data-theme="forest" aria-label="Forest theme"><i class="fas fa-leaf"></i></button>
    <button class="theme-button" data-theme="rose" aria-label="Rose theme"><i class="fas fa-spa"></i></button>
  </div>

  <div class="logo-container">
    <img src="moe-logo.webp" alt="Ministry of Education Logo">
  </div>

  <main id="main-content">
    <section id="subjects-page">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="landing.html">Grades</a>
        <i class="fas fa-chevron-right" aria-hidden="true"></i>
        <span id="grade-display" aria-current="page"></span>
      </nav>

      <h1>Choose a subject</h1>
      <p class="streak"><span id="streakCountText">Loading streak...</span></p>

      <div id="dynamic-subjects-container" aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Boom AI. Powered by Pope John</p>
  </footer>

  <script>
    const firebaseConfig = {
        apiKey: "AIzaSyABCpgwLNKvUxdYtnz5HBHH9IlnDZgEbUo",
        authDomain: "creative-learning-f2252.firebaseapp.com",
        projectId: "creative-learning-f2252",
        storageBucket: "creative-learning-f2252.appspot.com",
        messagingSenderId: "451756350336",
        appId: "1:451756350336:web:19b9255b8834a01f4cff65"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    const juniorSubjects = [
      { id: 'mathematics', name: 'Mathematics', icon: 'fas fa-square-root-alt' },
      { id: 'english', name: 'English', icon: 'fas fa-language' },
      { id: 'kiswahili', name: 'Kiswahili', icon: 'fas fa-comments' },
      { id: 'integrated-science', name: 'Integrated Science', icon: 'fas fa-flask' },
      { id: 'social-studies', name: 'Social Studies', icon: 'fas fa-globe-americas' },
      { id: 'cre', name: 'Christian Religious Education', icon: 'fas fa-church' },
      { id: 'pre-technical', name: 'Pre-Technical', icon: 'fas fa-cogs' },
      { id: 'agriculture-nutrition', name: 'Agriculture and Nutrition', icon: 'fas fa-seedling' },
      { id: 'creative-arts-sports', name: 'Creative Arts and Sports', icon: 'fas fa-palette' }
    ];

    const seniorSchoolCategories = [
      {
        category: 'Core Subjects',
        subjects: [
          { id: 'senior-english', name: 'English', icon: 'fas fa-language' },
          { id: 'senior-kiswahili', name: 'Kiswahili / KSL', icon: 'fas fa-comments' },
          { id: 'core-mathematics', name: 'Core Mathematics', icon: 'fas fa-square-root-alt' },
          { id: 'essential-mathematics', name: 'Essential Mathematics', icon: 'fas fa-calculator' },
          { id: 'csl', name: 'Community Service Learning (CSL)', icon: 'fas fa-hands-helping' }
        ]
      },
      {
        category: 'Arts & Sports Science',
        subjects: [
          { id: 'sports-recreation', name: 'Sports and Recreation', icon: 'fas fa-running' },
          { id: 'music-dance', name: 'Music and Dance', icon: 'fas fa-music' },
          { id: 'theatre-film', name: 'Theatre and Film', icon: 'fas fa-video' },
          { id: 'fine-arts', name: 'Fine Arts', icon: 'fas fa-paint-brush' }
        ]
      },
      {
        category: 'Social Sciences',
        subjects: [
          { id: 'literature-english', name: 'Literature in English', icon: 'fas fa-book' },
          { id: 'indigenous-languages', name: 'Indigenous Languages', icon: 'fas fa-language' },
          { id: 'fasihi-kiswahili', name: 'Fasihi ya Kiswahili', icon: 'fas fa-book-open' },
          { id: 'sign-language', name: 'Sign Language', icon: 'fas fa-hands' },
          { id: 'arabic', name: 'Arabic', icon: 'fas fa-comment-dots' },
          { id: 'french', name: 'French', icon: 'fas fa-globe-europe' },
          { id: 'german', name: 'German', icon: 'fas fa-globe-europe' },
          { id: 'mandarin-chinese', name: 'Mandarin Chinese', icon: 'fas fa-globe-asia' },
          { id: 'cre-senior', name: 'Christian Religious Education', icon: 'fas fa-church' },
          { id: 'ire-senior', name: 'Islamic Religious Education', icon: 'fas fa-mosque' },
          { id: 'hre-senior', name: 'Hindu Religious Education', icon: 'fas fa-om' },
          { id: 'business-studies', name: 'Business Studies', icon: 'fas fa-briefcase' },
          { id: 'history-citizenship', name: 'History and Citizenship', icon: 'fas fa-landmark' },
          { id: 'geography', name: 'Geography', icon: 'fas fa-map-marked-alt' }
        ]
      },
      {
        category: 'Science, Technology, Engineering & Mathematics (STEM)',
        subjects: [
          { id: 'biology', name: 'Biology', icon: 'fas fa-dna' },
          { id: 'chemistry', name: 'Chemistry', icon: 'fas fa-flask' },
          { id: 'physics', name: 'Physics', icon: 'fas fa-bolt' },
          { id: 'general-science', name: 'General Science', icon: 'fas fa-vial' },
          { id: 'agriculture', name: 'Agriculture', icon: 'fas fa-seedling' },
          { id: 'computer-studies', name: 'Computer Studies', icon: 'fas fa-laptop-code' },
          { id: 'home-science', name: 'Home Science', icon: 'fas fa-utensils' },
          { id: 'aviation', name: 'Aviation', icon: 'fas fa-plane' },
          { id: 'building-construction', name: 'Building Construction', icon: 'fas fa-hard-hat' },
          { id: 'electricity', name: 'Electricity', icon: 'fas fa-plug' },
          { id: 'metalwork', name: 'Metalwork', icon: 'fas fa-hammer' },
          { id: 'power-mechanics', name: 'Power Mechanics', icon: 'fas fa-car' },
          { id: 'wood-technology', name: 'Wood Technology', icon: 'fas fa-tree' },
          { id: 'media-technology', name: 'Media Technology', icon: 'fas fa-photo-video' },
          { id: 'marine-fisheries', name: 'Marine and Fisheries Technology', icon: 'fas fa-water' }
        ]
      }
    ];

    document.addEventListener('DOMContentLoaded', async function () {
      const grade = localStorage.getItem('selectedGrade') || 'Grade 8';
      document.getElementById('grade-display').textContent = grade;
      document.title = `${grade} subjects | Boom AI`;

      checkStreakAndMilestones();
      await renderSubjects(grade);
    });

    function checkStreakAndMilestones() {
      const today = new Date().toDateString();
      let streakData = JSON.parse(localStorage.getItem('boom_streak') || '{}');

      if (streakData.lastDate !== today) {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);

        if (streakData.lastDate === yesterday.toDateString()) {
          streakData.count = (streakData.count || 0) + 1;
        } else {
          streakData.count = 1;
        }
        streakData.lastDate = today;
        localStorage.setItem('boom_streak', JSON.stringify(streakData));

        if ([3, 7, 30].includes(streakData.count)) {
          showToast(`${streakData.count}-day study streak. Keep going!`, 5000);
        }
      }
      const n = streakData.count || 1;
      document.getElementById('streakCountText').textContent = `${n}-day study streak`;
    }

    function subjectCardHTML(s, notesBySubject) {
      const stats = notesBySubject[s.id] || { total: 0, read: 0 };
      const percent = stats.total > 0 ? Math.round((stats.read / stats.total) * 100) : 0;
      const label = stats.total > 0 ? `${stats.read} of ${stats.total} notes read` : 'No notes yet';
      return `
        <a class="subject-card" href="note.html?subject=${s.id}">
          <span class="subject-card-title"><i class="${s.icon}" aria-hidden="true"></i> ${s.name}</span>
          <span>
            <span class="progress-container" role="progressbar" aria-label="${s.name} progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}" style="display:block;">
              <span class="progress-fill" style="display:block; width:${percent}%;"></span>
            </span>
            <span class="progress-text">${label}</span>
          </span>
        </a>`;
    }

    function showSkeleton(container) {
      container.innerHTML = '<div class="loading-grid" aria-hidden="true">' +
        '<div class="skeleton skeleton-card"></div>'.repeat(6) + '</div>';
    }

    async function renderSubjects(grade) {
      const container = document.getElementById('dynamic-subjects-container');
      const readNotes = JSON.parse(localStorage.getItem('boom_read_notes') || '[]');
      showSkeleton(container);

      try {
        const snapshot = await db.collection('notes').where('grade', '==', grade).get();
        const notesBySubject = {};
        snapshot.forEach(doc => {
          const data = doc.data();
          const subj = data.subject;
          if (!notesBySubject[subj]) notesBySubject[subj] = { total: 0, read: 0 };
          notesBySubject[subj].total++;
          if (readNotes.includes(doc.id)) {
            notesBySubject[subj].read++;
          }
        });

        if (grade === 'Grade 10') {
          container.innerHTML = seniorSchoolCategories.map(cat => `
            <div class="pathway-section">
              <h2 class="pathway-title">${cat.category}</h2>
              <div class="subject-list">
                ${cat.subjects.map(s => subjectCardHTML(s, notesBySubject)).join('')}
              </div>
            </div>
          `).join('');
        } else {
          container.innerHTML = `
            <div class="subject-list">
              ${juniorSubjects.map(s => subjectCardHTML(s, notesBySubject)).join('')}
            </div>
          `;
        }
      } catch (err) {
        console.error("Error loading subjects:", err);
        container.innerHTML = `
          <div class="state-block">
            <p>Subjects could not load. Check your internet connection and try again.</p>
            <button type="button" class="btn btn-primary" id="retryBtn"><i class="fas fa-rotate-right" aria-hidden="true"></i> Try again</button>
          </div>`;
        document.getElementById('retryBtn').addEventListener('click', () => renderSubjects(grade));
      }
    }
  </script>
</body>
</html>
