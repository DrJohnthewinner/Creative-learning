<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Subject | Learn with Fun!</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css">
  <style>
    /* Non-theme related layout styles */
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .logo-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }
    .logo-container img {
      height: 60px;
      width: auto;
      max-width: 200px;
    }
    #main-content {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
      animation: fadeIn 1s ease-in-out;
      margin-top: 40px;
      flex-grow: 1;
    }
    #subjects-page {
      border-radius: 25px;
      padding: 40px 30px;
      max-width: 900px;
      width: 100%;
      text-align: center;
    }
    h2 {
      font-weight: 600;
      font-size: 2.5rem;
      margin-bottom: 25px;
    }

    /* Recently Viewed Strip */
    .recently-viewed-section {
      margin-bottom: 30px;
      padding: 20px;
      background: var(--button-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      text-align: left;
    }
    .recently-viewed-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--heading-color);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .recently-viewed-list {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
    }
    .recently-viewed-card {
      min-width: 180px;
      max-width: 220px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 15px;
      text-decoration: none;
      color: var(--text-color);
      transition: all 0.3s ease;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .recently-viewed-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent-color-1);
      box-shadow: 0 5px 15px var(--shadow-color);
    }
    .rv-topic {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--heading-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rv-meta {
      font-size: 0.8rem;
      opacity: 0.8;
      margin-top: 5px;
    }

    .subject-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }
    .subject-button {
      padding: 18px 20px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s ease;
      position: relative;
    }
    .subject-button-content {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }
    .subject-button i {
      font-size: 1.3rem;
    }
    .note-count-badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--accent-color-1);
      color: #fff;
      min-width: 28px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .last-selected-tag {
      font-size: 0.75rem;
      background: #e83e8c;
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      position: absolute;
      top: -8px;
      right: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .back-button {
      padding: 12px 25px;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 20px;
    }
    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="background-aurora">
      <div class="aurora-shape shape1"></div>
      <div class="aurora-shape shape2"></div>
      <div class="aurora-shape shape3"></div>
  </div>
  <div class="theme-switcher">
    <button class="theme-button" data-theme="dark" aria-label="Dark theme"><i class="fas fa-moon"></i></button>
    <button class="theme-button" data-theme="light" aria-label="Light theme"><i class="fas fa-sun"></i></button>
    <button class="theme-button" data-theme="sepia" aria-label="Sepia theme"><i class="fas fa-book-open"></i></button>
    <button class="theme-button" data-theme="midnight" aria-label="Midnight theme"><i class="fas fa-star-of-david"></i></button>
    <button class="theme-button" data-theme="ocean" aria-label="Ocean theme"><i class="fas fa-water"></i></button>
    <button class="theme-button" data-theme="forest" aria-label="Forest theme"><i class="fas fa-leaf"></i></button>
    <button class="theme-button" data-theme="rose" aria-label="Rose theme"><i class="fas fa-spa"></i></button>
  </div>
  <div class="logo-container">
    <img src="moe-logo.webp" alt="Ministry of Education Logo">
  </div>

  <div id="main-content">
    <section id="subjects-page">
      <button class="back-button" onclick="goBackToGradesPage()">
        <i class="fas fa-arrow-left"></i> Back to Grades
      </button>

      <h2><i class="fas fa-book-open"></i> Select a Subject for <span id="grade-display"></span></h2>

      <!-- Recently Viewed Strip -->
      <div id="recently-viewed-container" style="display: none;"></div>

      <div class="subject-list" id="subject-grid">
        <button class="subject-button" data-subject="mathematics" onclick="navigateToSubjectPage('mathematics')">
          <div class="subject-button-content"><i class="fas fa-square-root-alt"></i> Mathematics</div>
          <span class="note-count-badge" id="badge-mathematics">...</span>
        </button>

        <button class="subject-button" data-subject="english" onclick="navigateToSubjectPage('english')">
          <div class="subject-button-content"><i class="fas fa-language"></i> English</div>
          <span class="note-count-badge" id="badge-english">...</span>
        </button>

        <button class="subject-button" data-subject="kiswahili" onclick="navigateToSubjectPage('kiswahili')">
          <div class="subject-button-content"><i class="fas fa-comments"></i> Kiswahili</div>
          <span class="note-count-badge" id="badge-kiswahili">...</span>
        </button>

        <button class="subject-button" data-subject="integrated-science" onclick="navigateToSubjectPage('integrated-science')">
          <div class="subject-button-content"><i class="fas fa-flask"></i> Integrated Science</div>
          <span class="note-count-badge" id="badge-integrated-science">...</span>
        </button>

        <button class="subject-button" data-subject="social-studies" onclick="navigateToSubjectPage('social-studies')">
          <div class="subject-button-content"><i class="fas fa-globe-americas"></i> Social Studies</div>
          <span class="note-count-badge" id="badge-social-studies">...</span>
        </button>

        <button class="subject-button" data-subject="cre" onclick="navigateToSubjectPage('cre')">
          <div class="subject-button-content"><i class="fas fa-church"></i> CRE</div>
          <span class="note-count-badge" id="badge-cre">...</span>
        </button>

        <button class="subject-button" data-subject="pre-technical" onclick="navigateToSubjectPage('pre-technical')">
          <div class="subject-button-content"><i class="fas fa-cogs"></i> Pre-Technical</div>
          <span class="note-count-badge" id="badge-pre-technical">...</span>
        </button>

        <button class="subject-button" data-subject="agriculture-nutrition" onclick="navigateToSubjectPage('agriculture-nutrition')">
          <div class="subject-button-content"><i class="fas fa-seedling"></i> Agriculture &amp; Nutrition</div>
          <span class="note-count-badge" id="badge-agriculture-nutrition">...</span>
        </button>

        <button class="subject-button" data-subject="creative-arts-sports" onclick="navigateToSubjectPage('creative-arts-sports')">
          <div class="subject-button-content"><i class="fas fa-palette"></i> Creative Arts &amp; Sports</div>
          <span class="note-count-badge" id="badge-creative-arts-sports">...</span>
        </button>
      </div>
    </section>
  </div>

  <footer>
    <p> &copy; Creative Learning</p>
    <p>Creative Learning is hereby owned by Pope John</p>
  </footer>

  <script src="script.js"></script>
  <script src="theme.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyABCpgwLNKvUxdYtnz5HBHH9IlnDZgEbUo",
      authDomain: "creative-learning-f2252.firebaseapp.com",
      projectId: "creative-learning-f2252",
      storageBucket: "creative-learning-f2252.appspot.com",
      messagingSenderId: "451756350336",
      appId: "1:451756350336:web:19b9255b8834a01f4cff65"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    document.addEventListener('DOMContentLoaded', function () {
      const grade = localStorage.getItem('selectedGrade') || 'Grade 7';
      document.getElementById('grade-display').textContent = grade;

      // Highlight last chosen subject
      const lastSubj = localStorage.getItem('lastSubject');
      if (lastSubj) {
        const btn = document.querySelector(`.subject-button[data-subject="${lastSubj}"]`);
        if (btn) {
          const tag = document.createElement('span');
          tag.className = 'last-selected-tag';
          tag.textContent = 'Last Selected';
          btn.appendChild(tag);
        }
      }

      // Render Recently Viewed Strip
      renderRecentlyViewed();

      // Fetch Note Counts dynamically from Firestore
      fetchSubjectNoteCounts(grade);
    });

    function renderRecentlyViewed() {
      try {
        const recent = JSON.parse(localStorage.getItem('recentlyViewedNotes') || '[]');
        if (recent.length > 0) {
          const container = document.getElementById('recently-viewed-container');
          let cardsHTML = '';
          recent.forEach(item => {
            const subjFormatted = (item.subject || '').replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            cardsHTML += `
              <a href="detail.html?noteId=${item.id}" class="recently-viewed-card">
                <div class="rv-topic"><i class="fas fa-file-alt"></i> ${item.topic}</div>
                <div class="rv-meta">${item.grade} • ${subjFormatted}</div>
              </a>
            `;
          });

          container.innerHTML = `
            <div class="recently-viewed-section">
              <div class="recently-viewed-title"><i class="fas fa-history"></i> Recently Viewed Notes</div>
              <div class="recently-viewed-list">${cardsHTML}</div>
            </div>
          `;
          container.style.display = 'block';
        }
      } catch (e) {
        console.error("Error rendering recently viewed strip:", e);
      }
    }

    function fetchSubjectNoteCounts(grade) {
      db.collection('notes').where('grade', '==', grade).get()
        .then(snapshot => {
          const counts = {};
          snapshot.forEach(doc => {
            const data = doc.data();
            if (data.subject) {
              const sKey = data.subject.toLowerCase();
              counts[sKey] = (counts[sKey] || 0) + 1;
            }
          });

          document.querySelectorAll('.subject-button').forEach(btn => {
            const sId = btn.getAttribute('data-subject');
            const badge = document.getElementById(`badge-${sId}`);
            if (badge) {
              badge.textContent = counts[sId] || 0;
            }
          });
        })
        .catch(err => {
          console.error("Error fetching note counts:", err);
          document.querySelectorAll('.note-count-badge').forEach(b => b.textContent = '0');
        });
    }
  </script>
</body>
</html>
