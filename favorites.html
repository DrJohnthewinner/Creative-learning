<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your favourites | Boom AI</title>

    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <script src="tools.js"></script>

    <style>
        /* Page-specific layout only. */
        body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: var(--sp-4); position: relative; }
        .moe-logo { position: absolute; top: var(--sp-4); left: var(--sp-4); height: var(--sp-7); width: auto; }

        #main-content { width: 100%; max-width: var(--content-w); flex: 1; padding-top: calc(var(--sp-7) * 2 + var(--sp-3)); }
        @media (min-width: 768px) { #main-content { padding-top: var(--sp-7); } }

        #notes-page { padding: var(--sp-5); }
        @media (min-width: 768px) { #notes-page { padding: var(--sp-6); } }

        .page-top { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-3); }
        #notes-page h1 { margin: 0 0 var(--sp-5); }
        .note-meta-line { display: block; margin-top: var(--sp-1); font-size: var(--fs-1); color: var(--text-muted); }

        .footer { margin-top: var(--sp-7); padding: var(--sp-5) 0 var(--sp-2); }
    </style>
</head>
<body>
    <div class="theme-switcher">
        <button class="theme-button" data-theme="dark" aria-label="Dark theme"><i class="fas fa-moon"></i></button>
        <button class="theme-button" data-theme="light" aria-label="Light theme"><i class="fas fa-sun"></i></button>
        <button class="theme-button" data-theme="sepia" aria-label="Sepia theme"><i class="fas fa-book-open"></i></button>
        <button class="theme-button" data-theme="midnight" aria-label="Midnight theme"><i class="fas fa-star"></i></button>
        <button class="theme-button" data-theme="ocean" aria-label="Ocean theme"><i class="fas fa-water"></i></button>
        <button class="theme-button" data-theme="forest" aria-label="Forest theme"><i class="fas fa-leaf"></i></button>
        <button class="theme-button" data-theme="rose" aria-label="Rose theme"><i class="fas fa-spa"></i></button>
    </div>

    <img src="moe-logo.webp" alt="Ministry of Education Logo" class="moe-logo">

    <main id="main-content">
        <section id="notes-page">
            <div class="page-top">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="subjects.html">Subjects</a>
                    <i class="fas fa-chevron-right" aria-hidden="true"></i>
                    <span aria-current="page">Favourites</span>
                </nav>
                <div id="tools-slot" class="toolbar"></div>
            </div>

            <h1>Your favourites</h1>

            <div id="favorite-notes-area" aria-live="polite">
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Boom AI. Powered by Pope John.</p>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyABCpgwLNKvUxdYtnz5HBHH9IlnDZgEbUo",
            authDomain: "creative-learning-f2252.firebaseapp.com",
            projectId: "creative-learning-f2252",
            storageBucket: "creative-learning-f2252.appspot.com",
            messagingSenderId: "451756350336",
            appId: "1:451756350336:web:19b9255b8834a01f4cff65"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        const area = () => document.getElementById('favorite-notes-area');

        function showState(message, buttonLabel, href, onClick) {
            area().innerHTML = `<div class="state-block"><p>${escapeHtml(message)}</p>` +
                (href ? `<a class="btn btn-primary" href="${href}">${escapeHtml(buttonLabel)}</a>`
                      : `<button type="button" class="btn btn-primary" id="stateBtn">${escapeHtml(buttonLabel)}</button>`) + '</div>';
            if (!href && onClick) document.getElementById('stateBtn').addEventListener('click', onClick);
        }

        function renderNotes(notes) {
            if (notes.length === 0) {
                showState('You have not saved any notes yet. Tap the heart on a note to keep it here for revision.', 'Browse subjects', 'subjects.html');
                return;
            }
            area().innerHTML = '<ul class="note-list">' + notes.map(note => {
                const subject = note.subject ? formatSubject(note.subject) : '';
                const meta = [subject, note.grade].filter(Boolean).map(escapeHtml).join(' · ');
                return `
                <li class="note-item">
                    <button type="button" class="favorite-icon-container" data-fav="${note.id}" aria-pressed="true" aria-label="Remove from favourites">
                        <i class="fas fa-heart favorite-icon favorited"></i>
                    </button>
                    <h2 class="note-topic"><a class="note-link" href="detail.html?noteId=${note.id}">${escapeHtml(note.noteTopic || 'Untitled note')}</a></h2>
                    ${note.subTopic ? `<span class="note-sub-topic">${escapeHtml(note.subTopic)}</span>` : ''}
                    ${meta ? `<span class="note-meta-line">${meta}</span>` : ''}
                    <p class="note-content">${escapeHtml(getSnippet(note.content))}</p>
                </li>`;
            }).join('') + '</ul>';
        }

        function loadFavoriteNotes() {
            const favoriteIds = getFavs();
            if (favoriteIds.length === 0) { renderNotes([]); return; }

            area().innerHTML = '<div class="skeleton skeleton-card"></div>'.repeat(Math.min(favoriteIds.length, 3));

            Promise.all(favoriteIds.map(id => db.collection('notes').doc(id).get()))
                .then(snaps => {
                    const notes = snaps.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
                    notes.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    renderNotes(notes);
                })
                .catch(error => {
                    console.error('Error fetching favourite notes:', error);
                    showState('Your favourites could not load. Check your internet connection and try again.', 'Try again', null, loadFavoriteNotes);
                });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadFavoriteNotes();
            // Tapping a heart here removes the note from the list
            area().addEventListener('click', (e) => {
                const btn = e.target.closest('[data-fav]');
                if (!btn) return;
                toggleFav(btn.dataset.fav);
                showToast('Removed from favourites');
                btn.closest('li').remove();
                if (!area().querySelector('.note-item')) renderNotes([]);
            });
        });
    </script>
</body>
</html>
