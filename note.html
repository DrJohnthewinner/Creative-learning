<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes | Boom AI</title>

    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <script src="tools.js"></script>

    <style>
        /* Page-specific layout only. */
        body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: var(--sp-4); position: relative; }
        .moe-logo { position: absolute; top: var(--sp-4); left: var(--sp-4); height: var(--sp-7); width: auto; }

        #main-content { width: 100%; max-width: var(--content-w); flex: 1; padding-top: calc(var(--sp-7) * 2 + var(--sp-3)); }
        @media (min-width: 768px) { #main-content { padding-top: var(--sp-7); } }

        #notes-page { padding: var(--sp-5); }
        @media (min-width: 768px) { #notes-page { padding: var(--sp-6); } }

        .page-top { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-3); }
        #notes-page h1 { margin: 0 0 var(--sp-4); }

        .search-container { position: relative; margin-bottom: var(--sp-3); }
        #search-input { width: 100%; padding-right: calc(var(--tap) * 2); border-radius: var(--r-pill); padding-left: var(--sp-5); }
        .search-clear-btn { position: absolute; right: var(--tap); top: 0; width: var(--tap); height: var(--tap); border: 0; background: transparent; color: var(--text); cursor: pointer; display: none; }
        .search-icon { position: absolute; right: 0; top: 0; width: var(--tap); height: var(--tap); display: flex; align-items: center; justify-content: center; color: var(--text-muted); pointer-events: none; }

        .search-chips-container { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-3); }
        .search-chips-container .label { font-size: var(--fs-1); color: var(--text-muted); }
        .results-count { margin: 0 0 var(--sp-3); font-size: var(--fs-2); color: var(--text-muted); }

        .footer { margin-top: var(--sp-7); padding: var(--sp-5) 0 var(--sp-2); }
    </style>
</head>
<body>
    <div class="theme-switcher">
        <button class="theme-button" data-theme="dark" aria-label="Dark theme"><i class="fas fa-moon"></i></button>
        <button class="theme-button" data-theme="light" aria-label="Light theme"><i class="fas fa-sun"></i></button>
        <button class="theme-button" data-theme="sepia" aria-label="Sepia theme"><i class="fas fa-book-open"></i></button>
        <button class="theme-button" data-theme="midnight" aria-label="Midnight theme"><i class="fas fa-star"></i></button>
        <button class="theme-button" data-theme="ocean" aria-label="Ocean theme"><i class="fas fa-water"></i></button>
        <button class="theme-button" data-theme="forest" aria-label="Forest theme"><i class="fas fa-leaf"></i></button>
        <button class="theme-button" data-theme="rose" aria-label="Rose theme"><i class="fas fa-spa"></i></button>
    </div>

    <img src="moe-logo.webp" alt="Ministry of Education Logo" class="moe-logo">

    <main id="main-content">
        <section id="notes-page">
            <div class="page-top">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="landing.html" id="bc-grade-link"><span id="bc-grade">Grade</span></a>
                    <i class="fas fa-chevron-right" aria-hidden="true"></i>
                    <a href="subjects.html">Subjects</a>
                </nav>
                <div id="tools-slot" class="toolbar"></div>
            </div>

            <h1 id="subject-name">Notes</h1>

            <div class="search-container">
                <input type="search" id="search-input" placeholder="Search by topic, subtopic or keyword" aria-label="Search notes" autocomplete="off">
                <button type="button" class="search-clear-btn" id="search-clear" onclick="clearSearch()" aria-label="Clear search"><i class="fas fa-xmark"></i></button>
                <span class="search-icon" aria-hidden="true"><i class="fas fa-magnifying-glass"></i></span>
            </div>

            <div class="search-chips-container" id="search-chips"></div>
            <p class="results-count" id="results-count" aria-live="polite"></p>

            <div id="subject-notes-area">
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            </div>
        </section>
    </main>

    <button type="button" class="back-to-top" id="backToTop" onclick="scrollToTop()" aria-label="Back to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <footer class="footer">
        <p>&copy; 2026 Boom AI. Powered by Pope John.</p>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyABCpgwLNKvUxdYtnz5HBHH9IlnDZgEbUo",
            authDomain: "creative-learning-f2252.firebaseapp.com",
            projectId: "creative-learning-f2252",
            storageBucket: "creative-learning-f2252.appspot.com",
            messagingSenderId: "451756350336",
            appId: "1:451756350336:web:19b9255b8834a01f4cff65"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        let allNotes = [];
        let currentSubject = '';
        let currentGrade = '';
        const NEW_DAYS = 7;

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const subjectId = urlParams.get('subject');
            const grade = localStorage.getItem('selectedGrade') || 'Grade 8';
            currentGrade = grade;
            document.getElementById('bc-grade').textContent = grade;
            touchStreak();
            renderSearchChips();

            if (subjectId) {
                currentSubject = subjectId.toLowerCase();
                const formatted = formatSubject(subjectId);
                document.getElementById('subject-name').textContent = formatted;
                document.title = `${formatted}, ${grade} | Boom AI`;

                // Calculator opens by itself for Mathematics on wide screens only
                // (on a phone it would cover the notes)
                if (currentSubject === 'mathematics' && window.matchMedia('(min-width: 768px)').matches) {
                    toggleCalculator();
                }
                loadSubjectNotes(currentSubject, grade);
            } else {
                showState('Choose a subject first to see its notes.', 'Choose a subject', 'subjects.html');
            }

            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', () => { toggleClearButton(); searchNotes(); });
            searchInput.addEventListener('change', () => {
                const val = searchInput.value.trim();
                if (val) saveSearchHistory(val);
            });

            // One delegated listener for every heart button
            document.getElementById('subject-notes-area').addEventListener('click', (e) => {
                const btn = e.target.closest('[data-fav]');
                if (!btn) return;
                const nowOn = toggleFav(btn.dataset.fav);
                btn.setAttribute('aria-pressed', nowOn);
                btn.setAttribute('aria-label', nowOn ? 'Remove from favourites' : 'Add to favourites');
                const icon = btn.querySelector('.fa-heart');
                icon.className = `${nowOn ? 'fas' : 'far'} fa-heart favorite-icon ${nowOn ? 'favorited pop' : ''}`;
                showToast(nowOn ? 'Added to favourites' : 'Removed from favourites');
            });

            window.addEventListener('scroll', () => {
                document.getElementById('backToTop').style.display = window.scrollY > 300 ? 'flex' : 'none';
            });
        });

        function showState(message, buttonLabel, href, onClick) {
            const area = document.getElementById('subject-notes-area');
            area.innerHTML = `<div class="state-block"><p>${escapeHtml(message)}</p>` +
                (href ? `<a class="btn btn-primary" href="${href}">${escapeHtml(buttonLabel)}</a>`
                      : `<button type="button" class="btn btn-primary" id="stateBtn">${escapeHtml(buttonLabel)}</button>`) + '</div>';
            if (!href && onClick) document.getElementById('stateBtn').addEventListener('click', onClick);
            document.getElementById('results-count').textContent = '';
        }

        function loadSubjectNotes(subjectId, grade) {
            const notesArea = document.getElementById('subject-notes-area');
            notesArea.innerHTML = '<div class="skeleton skeleton-card"></div>'.repeat(3);
            db.collection('notes').where('subject', '==', subjectId).where('grade', '==', grade).orderBy('createdAt', 'desc').get()
                .then(querySnapshot => {
                    if (querySnapshot.empty) {
                        showState('No notes for this subject in ' + grade + ' yet. Try another subject.', 'Back to subjects', 'subjects.html');
                        return;
                    }
                    allNotes = querySnapshot.docs.map(doc => {
                        const data = doc.data();
                        return { id: doc.id, ...data, _text: getSnippet(data.content, 100000).toLowerCase() };
                    });
                    // Pinned notes first (admin "Pin" option); otherwise newest first as returned
                    allNotes = allNotes.filter(n => n.isPinned).concat(allNotes.filter(n => !n.isPinned));
                    renderNotes(allNotes);
                })
                .catch(err => {
                    console.error('Error loading notes:', err);
                    showState('Notes could not load. Check your internet connection and try again.', 'Try again', null,
                        () => loadSubjectNotes(subjectId, grade));
                });
        }

        function isNew(note) {
            try { return note.createdAt && (Date.now() - note.createdAt.toDate().getTime()) < NEW_DAYS * 864e5; }
            catch (e) { return false; }
        }

        function renderNotes(notesToRender, query = '') {
            const notesArea = document.getElementById('subject-notes-area');
            const counter = document.getElementById('results-count');

            if (notesToRender.length === 0) {
                counter.textContent = '';
                notesArea.innerHTML = `<div class="state-block"><p>No notes match “${escapeHtml(query)}”.</p>
                    <button type="button" class="btn" id="clearBtn">Clear search</button></div>`;
                document.getElementById('clearBtn').addEventListener('click', clearSearch);
                return;
            }
            counter.textContent = query ? `${notesToRender.length} ${notesToRender.length === 1 ? 'note' : 'notes'} found` : '';

            const readNotes = JSON.parse(localStorage.getItem('boom_read_notes') || '[]');
            const favs = getFavs();

            notesArea.innerHTML = '<ul class="note-list">' + notesToRender.map(note => {
                const isRead = readNotes.includes(note.id);
                const isFav = favs.includes(note.id);
                const type = note.contentType && note.contentType !== 'Notes' ? note.contentType : '';
                const flags = [
                    note.isPinned ? '<span><i class="fas fa-thumbtack" aria-hidden="true"></i> Pinned</span>' : '',
                    isNew(note) ? '<span class="badge badge-new">New</span>' : '',
                    type ? `<span class="badge">${escapeHtml(type)}</span>` : '',
                    note.fileUrl ? '<span><i class="fas fa-paperclip" aria-hidden="true"></i><span class="visually-hidden">Has attachment</span></span>' : '',
                    isRead ? '<span><i class="fas fa-check" aria-hidden="true"></i> Read</span>' : ''
                ].filter(Boolean).join('');

                return `
                <li class="note-item">
                    <button type="button" class="favorite-icon-container" data-fav="${note.id}" aria-pressed="${isFav}" aria-label="${isFav ? 'Remove from favourites' : 'Add to favourites'}">
                        <i class="${isFav ? 'fas' : 'far'} fa-heart favorite-icon ${isFav ? 'favorited' : ''}"></i>
                    </button>
                    ${flags ? `<div class="note-flags">${flags}</div>` : ''}
                    <h2 class="note-topic"><a class="note-link" href="detail.html?noteId=${note.id}">${highlightText(note.noteTopic || 'Untitled note', query)}</a></h2>
                    ${note.noteTitle ? `<span class="note-custom-title">${highlightText(note.noteTitle, query)}</span>` : ''}
                    ${note.subTopic ? `<span class="note-sub-topic">${highlightText(note.subTopic, query)}</span>` : ''}
                    <p class="note-content">${highlightText(getSnippet(note.content), query)}</p>
                </li>`;
            }).join('') + '</ul>';
        }

        function saveSearchHistory(query) {
            let history = JSON.parse(localStorage.getItem('boom_search_history') || '[]');
            history = history.filter(q => q.toLowerCase() !== query.toLowerCase());
            history.unshift(query);
            if (history.length > 5) history.pop();
            localStorage.setItem('boom_search_history', JSON.stringify(history));
            renderSearchChips();
        }

        function renderSearchChips() {
            const container = document.getElementById('search-chips');
            const history = JSON.parse(localStorage.getItem('boom_search_history') || '[]');
            if (history.length === 0) { container.innerHTML = ''; return; }
            container.innerHTML = '<span class="label">Recent:</span>' +
                history.map(q => `<button type="button" class="chip" data-q="${escapeHtml(q)}" onclick="applySearchChip(this.dataset.q)">${escapeHtml(q)}</button>`).join('');
        }

        function applySearchChip(query) {
            document.getElementById('search-input').value = query;
            toggleClearButton();
            searchNotes();
        }

        function searchNotes() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const filtered = allNotes.filter(note =>
                (note.noteTopic || '').toLowerCase().includes(query) ||
                (note.noteTitle || '').toLowerCase().includes(query) ||
                (note.subTopic || '').toLowerCase().includes(query) ||
                (note._text || '').includes(query)
            );
            renderNotes(filtered, query);
        }

        function clearSearch() {
            const input = document.getElementById('search-input');
            input.value = '';
            toggleClearButton();
            renderNotes(allNotes, '');
            input.focus();
        }

        function toggleClearButton() {
            const input = document.getElementById('search-input');
            document.getElementById('search-clear').style.display = input.value.length > 0 ? 'flex' : 'none';
            document.getElementById('search-clear').style.alignItems = 'center';
            document.getElementById('search-clear').style.justifyContent = 'center';
        }

        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    </script>
</body>
</html>
