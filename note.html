<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Notes | Boom AI</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; position: relative; }
        .moe-logo { position: absolute; top: 20px; left: 20px; height: 50px; z-index: 10; }
        
        .calc-toggle-btn {
            position: fixed;
            top: 20px;
            right: 280px;
            background: var(--button-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 42px; height: 42px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 1000;
            box-shadow: 0 4px 10px var(--shadow-color);
            transition: all 0.2s ease;
        }
        .calc-toggle-btn:hover { background: var(--accent-color-1); color: #fff; }
        @media(max-width: 768px) { .calc-toggle-btn { right: 20px; top: 80px; } }

        #main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 1000px; padding-top: 80px; }
        #notes-page { border-radius: 20px; padding: 40px; text-align: center; width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); }
        
        .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; margin-bottom: 20px; text-align: left; width: 100%; color: var(--text-color); }
        .breadcrumb a { color: var(--accent-color-1); text-decoration: none; font-weight: 600; }

        .widgets-bar { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; width: 100%; }
        .widget-card { flex: 1; min-width: 250px; background: var(--button-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; text-align: left; font-size: 0.9rem; color: var(--text-color); }
        .widget-card strong { color: var(--heading-color); display: block; margin-bottom: 5px; }

        h2 { font-weight: 700; font-size: 2.3rem; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 15px; color: var(--heading-color); }
        .back-button { padding: 12px 25px; border-radius: 50px; font-size: 1rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px; background: var(--button-bg); color: var(--button-text); border: 1px solid var(--border-color); }

        .search-container { width: 100%; margin-bottom: 10px; position: relative; }
        #search-input { width: 100%; padding: 14px 45px 14px 20px; border: 1px solid var(--border-color); border-radius: 30px; font-size: 1rem; background: var(--button-bg); color: var(--text-color); outline: none; }
        .search-clear-btn { position: absolute; right: 45px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--text-color); font-size: 1.2rem; cursor: pointer; display: none; }
        .search-container .search-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text-color); }
        
        .search-chips-container { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; text-align: left; }
        .search-chip { background: var(--button-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 5px 12px; border-radius: 20px; font-size: 0.82rem; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
        .search-chip:hover { background: var(--accent-color-1); color: #fff; }

        .results-count { text-align: left; font-size: 0.9rem; font-weight: 600; margin-bottom: 20px; opacity: 0.85; color: var(--text-color); }

        .calc-box { 
            position: fixed; top: 80px; right: 20px; width: 280px;
            background: var(--card-bg); border: 1px solid var(--border-color); 
            border-radius: 16px; padding: 20px; text-align: left; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); z-index: 2500; 
            backdrop-filter: blur(12px); display: none; 
            animation: fadeInCalc 0.2s ease-out;
        }
        @keyframes fadeInCalc { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .calc-box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 600; color: var(--heading-color); }
        .calc-box-close { background: transparent; border: none; color: var(--text-color); cursor: pointer; font-size: 1.1rem; }
        .calc-box input { width: 100%; padding: 12px; font-size: 1.2rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--button-bg); color: var(--text-color); margin-bottom: 12px; text-align: right; }
        .calc-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .calc-buttons button { padding: 12px; font-size: 1rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--button-bg); color: var(--text-color); cursor: pointer; font-weight: 600; }
        .calc-buttons button:hover { background: var(--accent-color-1); color: #fff; }

        .no-results-box { padding: 30px; background: var(--button-bg); border: 1px dashed var(--border-color); border-radius: 15px; text-align: center; color: var(--text-color); margin-top: 20px; }
        .no-results-box ul { list-style: none; margin-top: 10px; opacity: 0.85; }
        .no-results-box li { margin-bottom: 5px; font-size: 0.9rem; }

        .note-list { list-style: none; padding: 0; margin-top: 15px; }
        .note-item { padding: 25px; margin-bottom: 20px; border-radius: 15px; text-align: left; background: var(--button-bg); border: 1px solid var(--border-color); position: relative; }
        .note-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; color: var(--heading-color); }
        .note-sub-topic { display: block; font-size: 0.95rem; font-style: italic; margin-top: 3px; opacity: 0.85; color: var(--text-color); }
        
        .badge-container { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .badge { font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 5px; text-transform: uppercase; }
        .badge-new { background-color: #00c853; color: #ffffff; }
        .badge-attachment { background-color: var(--accent-color-1); color: #ffffff; }
        .badge-read { background-color: #2196F3; color: #ffffff; }
        .badge-read-time { background-color: rgba(255, 255, 255, 0.15); color: var(--text-color); }

        .note-content { font-size: 1.05rem; margin-bottom: 18px; line-height: 1.7; color: var(--text-color); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        mark.search-highlight { background-color: #ffeb3b; color: #000; padding: 2px 4px; border-radius: 3px; font-weight: 600; }

        .more-details-link { display: inline-block; margin-top: 10px; text-decoration: none; font-weight: 600; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border-color); color: var(--accent-color-1); }
        .date-info { display: block; margin-top: 15px; font-size: 0.85rem; font-style: italic; opacity: 0.75; color: var(--text-color); }

        .back-to-top { position: fixed; bottom: 30px; right: 30px; width: 48px; height: 48px; border-radius: 50%; background: var(--accent-color-1); color: #fff; border: none; cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 1.2rem; z-index: 999; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .footer { width: 100%; padding: 20px; text-align: center; margin-top: 40px; color: var(--text-color); }
    </style>
</head>
<body>
    <div class="background-aurora">
        <div class="aurora-shape shape1"></div>
        <div class="aurora-shape shape2"></div>
        <div class="aurora-shape shape3"></div>
    </div>
    
    <button class="calc-toggle-btn" id="calcToggleBtn" onclick="toggleCalculator()" title="Open Calculator">
        <i class="fas fa-calculator"></i>
    </button>

    <div class="theme-switcher">
        <button class="theme-button" data-theme="dark" aria-label="Dark theme"><i class="fas fa-moon"></i></button>
        <button class="theme-button" data-theme="light" aria-label="Light theme"><i class="fas fa-sun"></i></button>
        <button class="theme-button" data-theme="sepia" aria-label="Sepia theme"><i class="fas fa-book-open"></i></button>
        <button class="theme-button" data-theme="midnight" aria-label="Midnight theme"><i class="fas fa-star-of-david"></i></button>
        <button class="theme-button" data-theme="ocean" aria-label="Ocean theme"><i class="fas fa-water"></i></button>
        <button class="theme-button" data-theme="forest" aria-label="Forest theme"><i class="fas fa-leaf"></i></button>
        <button class="theme-button" data-theme="rose" aria-label="Rose theme"><i class="fas fa-spa"></i></button>
    </div>

    <img src="moe-logo.webp" alt="Ministry of Education Logo" class="moe-logo">

    <div class="calc-box" id="calc-box">
        <div class="calc-box-header">
            <span><i class="fas fa-calculator"></i> Calculator</span>
            <button class="calc-box-close" onclick="toggleCalculator()"><i class="fas fa-times"></i></button>
        </div>
        <input type="text" id="calc-input" readonly placeholder="0">
        <div class="calc-buttons">
            <button onclick="appendCalc('7')">7</button><button onclick="appendCalc('8')">8</button><button onclick="appendCalc('9')">9</button><button onclick="appendCalc('/')">/</button>
            <button onclick="appendCalc('4')">4</button><button onclick="appendCalc('5')">5</button><button onclick="appendCalc('6')">6</button><button onclick="appendCalc('*')">*</button>
            <button onclick="appendCalc('1')">1</button><button onclick="appendCalc('2')">2</button><button onclick="appendCalc('3')">3</button><button onclick="appendCalc('-')">-</button>
            <button onclick="clearCalc()">C</button><button onclick="appendCalc('0')">0</button><button onclick="calculateResult()">=</button><button onclick="appendCalc('+')">+</button>
        </div>
    </div>

    <div id="main-content">
        <section id="notes-page">
            <nav class="breadcrumb">
                <a href="landing.html"><i class="fas fa-graduation-cap"></i> <span id="bc-grade">Grade</span></a>
                <i class="fas fa-chevron-right"></i>
                <a href="subjects.html"><i class="fas fa-book-open"></i> Subjects</a>
                <i class="fas fa-chevron-right"></i>
                <span id="bc-subject">Notes</span>
            </nav>

            <div class="widgets-bar">
                <div class="widget-card" style="flex: 1; width: 100%;">
                    <strong><i class="fas fa-fire" style="color: #ff9800;"></i> Study Streak</strong>
                    <span id="streak-counter">Loading streak...</span>
                </div>
            </div>

            <button class="action-button back-button" onclick="window.location.href='subjects.html'">
                <i class="fas fa-arrow-left"></i> Back to Subjects
            </button>

            <h2><i class="fas fa-book"></i> Notes for <span id="subject-name"></span> (<span id="grade-display"></span>)</h2>

            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search notes by topic, subtopic or keyword...">
                <button class="search-clear-btn" id="search-clear" onclick="clearSearch()" aria-label="Clear Search">✕</button>
                <i class="fas fa-search search-icon"></i>
            </div>

            <div class="search-chips-container" id="search-chips"></div>

            <div class="results-count" id="results-count"></div>

            <div id="subject-notes-area">
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            </div>
        </section>
    </div>

    <button class="back-to-top" id="backToTop" onclick="scrollToTop()" aria-label="Back to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <footer class="footer">
        <p>&copy; 2026 Boom AI. Powered by Pope John.</p>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyABCpgwLNKvUxdYtnz5HBHH9IlnDZgEbUo",
            authDomain: "creative-learning-f2252.firebaseapp.com",
            projectId: "creative-learning-f2252",
            storageBucket: "creative-learning-f2252.appspot.com",
            messagingSenderId: "451756350336",
            appId: "1:451756350336:web:19b9255b8834a01f4cff65"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        let allNotes = [];

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const subjectId = urlParams.get('subject');
            const grade = localStorage.getItem('selectedGrade') || 'Grade 8';
            
            document.getElementById('bc-grade').textContent = grade;
            updateStudyStreak();

            if (subjectId) {
                const formattedSubject = subjectId.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                document.getElementById('subject-name').textContent = formattedSubject;
                document.getElementById('bc-subject').textContent = formattedSubject;
                document.getElementById('grade-display').textContent = grade;
                
                if (subjectId.toLowerCase() === 'mathematics') {
                    toggleCalculator();
                }

                loadSubjectNotes(subjectId.toLowerCase(), grade);
            }

            renderSearchChips();

            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', () => {
                toggleClearButton();
                searchNotes();
            });

            searchInput.addEventListener('change', () => {
                const val = searchInput.value.trim();
                if (val) saveSearchHistory(val);
            });

            window.addEventListener('scroll', () => {
                const btn = document.getElementById('backToTop');
                if (window.scrollY > 300) btn.style.display = 'flex';
                else btn.style.display = 'none';
            });

            window.addEventListener('keydown', (e) => {
                const calcBox = document.getElementById('calc-box');
                if (calcBox.style.display !== 'block') return;
                if (document.activeElement === searchInput) return;

                const key = e.key;
                if (!isNaN(key) || ['+', '-', '*', '/'].includes(key)) {
                    appendCalc(key);
                } else if (key === 'Enter' || key === '=') {
                    e.preventDefault();
                    calculateResult();
                } else if (key === 'Backspace') {
                    const input = document.getElementById('calc-input');
                    input.value = input.value.slice(0, -1);
                } else if (key === 'Escape' || key.toLowerCase() === 'c') {
                    clearCalc();
                }
            });
        });

        function toggleCalculator() {
            const box = document.getElementById('calc-box');
            if (box.style.display === 'block') {
                box.style.display = 'none';
            } else {
                box.style.display = 'block';
            }
        }

        function updateStudyStreak() {
            const today = new Date().toDateString();
            let streakData = JSON.parse(localStorage.getItem('boom_streak') || '{}');
            
            if (streakData.lastDate !== today) {
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                
                if (streakData.lastDate === yesterday.toDateString()) {
                    streakData.count = (streakData.count || 0) + 1;
                } else if (!streakData.lastDate) {
                    streakData.count = 1;
                } else {
                    streakData.count = 1;
                }
                streakData.lastDate = today;
                localStorage.setItem('boom_streak', JSON.stringify(streakData));
            }
            document.getElementById('streak-counter').textContent = `${streakData.count} Day Streak! Keep it up!`;
        }

        function appendCalc(val) { document.getElementById('calc-input').value += val; }
        function clearCalc() { document.getElementById('calc-input').value = ''; }
        function calculateResult() {
            try {
                document.getElementById('calc-input').value = eval(document.getElementById('calc-input').value);
            } catch (e) {
                document.getElementById('calc-input').value = 'Error';
            }
        }

        function saveSearchHistory(query) {
            let history = JSON.parse(localStorage.getItem('boom_search_history') || '[]');
            history = history.filter(q => q.toLowerCase() !== query.toLowerCase());
            history.unshift(query);
            if (history.length > 5) history.pop();
            localStorage.setItem('boom_search_history', JSON.stringify(history));
            renderSearchChips();
        }

        function renderSearchChips() {
            const container = document.getElementById('search-chips');
            const history = JSON.parse(localStorage.getItem('boom_search_history') || '[]');
            if (history.length === 0) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = '<span style="font-size:0.8rem; opacity:0.8; width:100%;">Recent Searches:</span>' + 
                history.map(q => `<span class="search-chip" onclick="applySearchChip('${q}')"><i class="fas fa-history"></i> ${q}</span>`).join('');
        }

        function applySearchChip(query) {
            const input = document.getElementById('search-input');
            input.value = query;
            toggleClearButton();
            searchNotes();
        }

        function loadSubjectNotes(subjectId, grade) {
            const notesArea = document.getElementById('subject-notes-area');
            db.collection('notes').where('subject', '==', subjectId).where('grade', '==', grade).orderBy('createdAt', 'desc').get()
                .then(querySnapshot => {
                    if (querySnapshot.empty) {
                        notesArea.innerHTML = '<p>No notes available for this subject yet.</p>';
                        document.getElementById('results-count').textContent = '0 results found';
                        return;
                    }
                    allNotes = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderNotes(allNotes);
                }).catch(error => {
                    console.error("Error loading notes:", error);
                    notesArea.innerHTML = `<p>Error loading notes. Please try again later.</p>`;
                });
        }

        function renderNotes(notesToRender, query = '') {
            const notesArea = document.getElementById('subject-notes-area');
            const resultsCounter = document.getElementById('results-count');

            resultsCounter.textContent = `${notesToRender.length} ${notesToRender.length === 1 ? 'result' : 'results'} found`;

            if (notesToRender.length === 0) {
                notesArea.innerHTML = `
                <div class="no-results-box">
                    <i class="fas fa-search" style="font-size:2rem; margin-bottom:10px;"></i>
                    <h4>No notes match your search</h4>
                    <ul>
                        <li>&bull; Try using fewer or broader keywords</li>
                        <li>&bull; Check your spelling or clear filters</li>
                        <li>&bull; Browse available notes in other subjects</li>
                    </ul>
                </div>`;
                return;
            }

            const readNotes = JSON.parse(localStorage.getItem('boom_read_notes') || '[]');

            let notesHTML = '<ul class="note-list">';
            notesToRender.forEach(note => {
                const createdDate = note.createdAt?.toDate ? note.createdAt.toDate() : new Date();
                const updatedDate = note.updatedAt?.toDate ? note.updatedAt.toDate() : null;

                const isNew = (new Date() - createdDate) / (1000 * 60 * 60 * 24) <= 7;
                const isRead = readNotes.includes(note.id);
                const wordCount = (note.content || '').split(/\s+/).length;
                const readingTime = Math.max(1, Math.ceil(wordCount / 200));

                const timeAgo = formatTimeAgo(createdDate);
                const postedDateStr = createdDate.toLocaleDateString();
                const updatedDateStr = updatedDate ? updatedDate.toLocaleDateString() : null;

                const safeTopic = highlightText(note.noteTopic || '', query);
                const safeSubTopic = highlightText(note.subTopic || '', query);
                const safeContent = highlightText(note.content || '', query);

                notesHTML += `
                <li class="note-item">
                    <div class="badge-container">
                        ${isNew ? '<span class="badge badge-new"><i class="fas fa-bolt"></i> NEW</span>' : ''}
                        ${isRead ? '<span class="badge badge-read"><i class="fas fa-check"></i> Read</span>' : ''}
                        ${note.fileUrl ? '<span class="badge badge-attachment"><i class="fas fa-paperclip"></i> Attachment</span>' : ''}
                        <span class="badge badge-read-time"><i class="fas fa-clock"></i> ${readingTime} min read</span>
                    </div>
                    <div class="note-title">${safeTopic}</div>
                    ${safeSubTopic ? `<span class="note-sub-topic">${safeSubTopic}</span>` : ''}
                    <div class="note-content">${safeContent}</div>
                    <a href="detail.html?noteId=${note.id}" class="more-details-link"><i class="fas fa-external-link-alt"></i> More Details</a>
                    <span class="date-info">
                        Posted ${timeAgo} (${postedDateStr})
                        ${updatedDateStr ? ` &bull; Last updated ${updatedDateStr}` : ''}
                    </span>
                </li>`;
            });
            notesHTML += '</ul>';
            notesArea.innerHTML = notesHTML;
        }

        function searchNotes() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const filteredNotes = allNotes.filter(note => 
                (note.noteTopic?.toLowerCase() || '').includes(query) ||
                (note.subTopic?.toLowerCase() || '').includes(query) ||
                (note.content?.toLowerCase() || '').includes(query)
            );
            renderNotes(filteredNotes, query);
        }

        function clearSearch() {
            const searchInput = document.getElementById('search-input');
            searchInput.value = '';
            toggleClearButton();
            renderNotes(allNotes, '');
        }

        function toggleClearButton() {
            const input = document.getElementById('search-input');
            const clearBtn = document.getElementById('search-clear');
            clearBtn.style.display = input.value.length > 0 ? 'block' : 'none';
        }

        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
            return text.replace(regex, '<mark class="search-highlight">$1</mark>');
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function formatTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = Math.floor(seconds / 31536000);
            if (interval >= 1) return `${interval} year${interval > 1 ? 's' : ''} ago`;
            interval = Math.floor(seconds / 2592000);
            if (interval >= 1) return `${interval} month${interval > 1 ? 's' : ''} ago`;
            interval = Math.floor(seconds / 86400);
            if (interval >= 1) return `${interval} day${interval > 1 ? 's' : ''} ago`;
            interval = Math.floor(seconds / 3600);
            if (interval >= 1) return `${interval} hour${interval > 1 ? 's' : ''} ago`;
            interval = Math.floor(seconds / 60);
            if (interval >= 1) return `${interval} minute${interval > 1 ? 's' : ''} ago`;
            return 'just now';
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
